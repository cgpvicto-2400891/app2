<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apps Mobiles 2 — Kotlin + Jetpack Compose + MVVM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ======================================================================
   TOKENS & PALETTES (Material 3 + Jetpack Compose / Kotlin)
   ====================================================================== */
:root {
  --paper: #F8F9FC;
  --panel: #FFFFFF;
  --panel-card: #FFFFFF;
  --ink: #11141D;
  --ink-soft: #5C6272;
  --line: #E2E5EE;
  --line-strong: #CBD1E0;

  /* Accents */
  --kotlin: #7F52FF;
  --kotlin-hover: #6B3EE6;
  --kotlin-dim: #F0EBFF;
  --kotlin-text: #6032D6;

  --android: #1E8F72;
  --android-dim: #E3F5EF;
  --amber: #D98A1B;
  --amber-dim: #FBF0DD;
  --red: #C4453A;
  --red-dim: #FDECEB;
  --blue: #2563EB;
  --blue-dim: #EFF6FF;

  /* Code Syntax (Theme Clair) */
  --code-bg: #1A1C23;
  --code-ink: #ECEEF5;
  --code-border: #2B2E3C;
  --syn-kw: #C792EA;
  --syn-ann: #FFCB6B;
  --syn-str: #C3E88D;
  --syn-type: #82AAFF;
  --syn-fn: #89DDFF;
  --syn-num: #F78C6C;
  --syn-com: #717CB4;

  /* Dimensions & Ombres */
  --sidebar-w: 268px;
  --radius: 8px;
  --radius-lg: 16px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.07), 0 2px 4px rgba(0,0,0,0.04);
  --shadow-lg: 0 12px 28px rgba(0,0,0,0.12), 0 4px 10px rgba(0,0,0,0.05);
}

[data-theme="dark"] {
  --paper: #0E1015;
  --panel: #16181F;
  --panel-card: #1D202A;
  --ink: #EDF0F7;
  --ink-soft: #9BA3B5;
  --line: #262A36;
  --line-strong: #383D4E;

  --kotlin: #9D7BFF;
  --kotlin-hover: #B295FF;
  --kotlin-dim: #251D3E;
  --kotlin-text: #D0BFFF;

  --android: #3DDC84;
  --android-dim: #133221;
  --amber: #F6AD55;
  --amber-dim: #382A14;
  --red: #FF7B72;
  --red-dim: #3A1817;
  --blue: #60A5FA;
  --blue-dim: #172A46;

  /* Code Syntax (Theme Sombre - Studio Dark) */
  --code-bg: #111217;
  --code-ink: #ECEEF5;
  --code-border: #232733;

  --shadow-sm: 0 1px 3px rgba(0,0,0,0.25);
  --shadow-md: 0 4px 14px rgba(0,0,0,0.35);
  --shadow-lg: 0 12px 30px rgba(0,0,0,0.5);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  transition: background-color .2s ease, color .2s ease;
}

h1, h2, h3, h4 {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-weight: 800;
  margin: 0 0 .4em 0;
  letter-spacing: -0.02em;
  color: var(--ink);
}
code, pre, .mono {
  font-family: 'JetBrains Mono', monospace;
}
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: none; }
::selection { background: var(--kotlin-dim); color: var(--kotlin-text); }

/* ======================================================================
   LAYOUT STRUCTURE
   ====================================================================== */
.shell {
  display: flex;
  min-height: 100vh;
}

/* SIDEBAR */
.sidebar {
  width: var(--sidebar-w);
  flex-shrink: 0;
  background: var(--panel);
  border-right: 1px solid var(--line);
  padding: 20px 16px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  z-index: 10;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 4px 18px 4px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 16px;
}
.brand-mark {
  width: 34px;
  height: 34px;
  border-radius: 9px;
  background: linear-gradient(135deg, var(--kotlin) 0%, #B241FF 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-family: 'JetBrains Mono';
  font-weight: 800;
  font-size: 16px;
  box-shadow: 0 3px 8px rgba(127, 82, 255, 0.35);
}
.brand-text {
  font-family: 'Plus Jakarta Sans';
  font-weight: 800;
  font-size: 15px;
  line-height: 1.2;
}
.brand-text span {
  display: block;
  font-family: 'Inter';
  font-weight: 500;
  color: var(--ink-soft);
  font-size: 11.5px;
  margin-top: 2px;
}

.progress-widget {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 10px 12px;
  margin-bottom: 16px;
}
.progress-widget-top {
  display: flex;
  justify-content: space-between;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--ink-soft);
  margin-bottom: 6px;
}
.progress-bar-wrap {
  height: 6px;
  background: var(--line);
  border-radius: 99px;
  overflow: hidden;
}
.progress-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--kotlin) 0%, var(--android) 100%);
  border-radius: 99px;
  transition: width .3s ease;
}

.navgroup { margin-bottom: 18px; }
.navgroup-label {
  font-size: 11px;
  color: var(--ink-soft);
  padding: 0 10px 6px 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.navitem {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 11px;
  border-radius: var(--radius);
  font-size: 13.5px;
  font-weight: 500;
  color: var(--ink-soft);
  text-decoration: none;
  margin-bottom: 2px;
  border: none;
  background: none;
  width: 100%;
  text-align: left;
  transition: all .15s ease;
}
.navitem:hover {
  background: var(--paper);
  color: var(--ink);
}
.navitem.active {
  background: var(--kotlin-dim);
  color: var(--kotlin-text);
  font-weight: 700;
}
.navitem svg { flex-shrink: 0; opacity: 0.8; }
.navitem.active svg { opacity: 1; }

.lesson-nav-btn {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 7px 10px;
  border-radius: var(--radius);
  font-size: 12.8px;
  color: var(--ink-soft);
  width: 100%;
  text-align: left;
  background: none;
  border: none;
  transition: all .15s ease;
}
.lesson-nav-btn:hover { background: var(--paper); color: var(--ink); }
.lesson-nav-btn.active { background: var(--kotlin-dim); color: var(--kotlin-text); font-weight: 700; }
.lesson-nav-btn .dot {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: 700;
  background: var(--line);
  color: var(--ink-soft);
  flex-shrink: 0;
}
.lesson-nav-btn.done .dot { background: var(--android); color: #fff; }
.lesson-nav-btn .fav-icon { font-size: 11px; color: var(--amber); margin-left: auto; }

/* TOPBAR */
main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}
.topbar {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(255, 255, 255, 0.85);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
  padding: 12px 32px;
  display: flex;
  gap: 16px;
  align-items: center;
}
[data-theme="dark"] .topbar {
  background: rgba(22, 24, 31, 0.85);
}

.search-container {
  position: relative;
  flex: 1;
  max-width: 520px;
}
.searchbox {
  display: flex;
  align-items: center;
  gap: 9px;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 7px 12px;
  transition: border-color .15s ease, box-shadow .15s ease;
}
.searchbox:focus-within {
  border-color: var(--kotlin);
  box-shadow: 0 0 0 3px var(--kotlin-dim);
  background: var(--panel);
}
.searchbox input {
  border: none;
  outline: none;
  background: none;
  flex: 1;
  font-family: inherit;
  font-size: 13.5px;
  color: var(--ink);
}
.searchbox svg { opacity: 0.6; flex-shrink: 0; color: var(--ink-soft); }
.search-shortcut {
  font-size: 10.5px;
  background: var(--panel);
  border: 1px solid var(--line);
  color: var(--ink-soft);
  padding: 2px 6px;
  border-radius: 4px;
  font-family: 'JetBrains Mono';
}

/* Instant Search Dropdown */
.search-results-dropdown {
  position: absolute;
  top: calc(100% + 6px);
  left: 0;
  right: 0;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow-lg);
  max-height: 420px;
  overflow-y: auto;
  display: none;
  z-index: 100;
  padding: 6px;
}
.search-results-dropdown.open { display: block; }
.search-res-group {
  padding: 6px 8px 4px 8px;
  font-size: 11px;
  font-weight: 700;
  color: var(--ink-soft);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.search-res-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 9px 12px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13.5px;
  color: var(--ink);
  transition: background .15s ease;
}
.search-res-item:hover {
  background: var(--kotlin-dim);
  color: var(--kotlin-text);
}
.search-res-item .subtag {
  font-size: 11px;
  background: var(--paper);
  padding: 2px 7px;
  border-radius: 99px;
  border: 1px solid var(--line);
  color: var(--ink-soft);
}

/* Actions topbar */
.topbar-actions {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-left: auto;
}
.theme-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  border-radius: var(--radius);
  background: var(--panel);
  border: 1px solid var(--line);
  color: var(--ink);
  font-size: 15px;
  transition: all .15s ease;
}
.theme-btn:hover {
  background: var(--paper);
  border-color: var(--kotlin);
}
.menu-btn {
  display: none;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  border: 1px solid var(--line);
  background: var(--panel);
  border-radius: var(--radius);
  color: var(--ink);
  font-size: 16px;
}

/* CONTENT CONTAINER */
.content {
  padding: 36px 48px 100px 48px;
  max-width: 980px;
  width: 100%;
  margin: 0 auto;
}

/* ======================================================================
   SHARED UI WIDGETS
   ====================================================================== */
.eyebrow-free-title {
  margin-bottom: 24px;
}
.eyebrow-free-title h1 {
  font-size: 32px;
  line-height: 1.15;
}
.sub {
  color: var(--ink-soft);
  font-size: 16px;
  margin-top: 4px;
}

.grid2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
@media(max-width:760px){ .grid2 { grid-template-columns: 1fr; } }

.card {
  background: var(--panel-card);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 20px 24px;
  box-shadow: var(--shadow-sm);
  transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
}
.card:hover {
  border-color: var(--line-strong);
}
.course-card {
  border-left: 4px solid var(--kotlin);
  display: flex;
  flex-direction: column;
}
.course-card h4 {
  font-size: 16px;
  margin-bottom: 4px;
}
.course-card .meta {
  font-size: 12.5px;
  color: var(--ink-soft);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.course-card .btn-row {
  margin-top: auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 10px;
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11.5px;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: 99px;
  line-height: 1.2;
}
.badge.beg { background: var(--android-dim); color: var(--android); }
.badge.mid { background: var(--amber-dim); color: var(--amber); }
.badge.adv { background: var(--red-dim); color: var(--red); }
.badge.dur { background: var(--paper); color: var(--ink-soft); border: 1px solid var(--line); font-weight: 500; }

.go-btn {
  border: 1px solid var(--kotlin);
  color: var(--kotlin);
  background: none;
  padding: 6px 14px;
  border-radius: var(--radius);
  font-size: 13px;
  font-weight: 600;
  transition: all .15s ease;
}
.go-btn:hover {
  background: var(--kotlin);
  color: #fff;
}

.chip {
  font-size: 12.8px;
  padding: 6px 13px;
  border-radius: 99px;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--ink);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all .15s ease;
}
.chip.linkable {
  border-color: var(--kotlin);
  color: var(--kotlin-text);
  background: var(--kotlin-dim);
  cursor: pointer;
  font-weight: 600;
}
.chip.linkable:hover {
  background: var(--kotlin);
  color: #fff;
}
.pill-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

/* ======================================================================
   LESSON VIEW SPECIFICS
   ====================================================================== */
.lesson-header {
  margin-bottom: 24px;
}
.back-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--ink-soft);
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 12px;
  cursor: pointer;
}
.back-link:hover { color: var(--kotlin); }
.lesson-header h1 {
  font-size: 32px;
  margin-bottom: 8px;
}
.lesson-meta-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--line);
}

/* Sticky Sub-nav TOC (Sommaire rapide) */
.lesson-toc {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  padding: 10px 0 16px 0;
  position: sticky;
  top: 61px;
  background: var(--paper);
  z-index: 30;
  border-bottom: 1px solid var(--line);
  margin-bottom: 28px;
}
.toc-pill {
  font-size: 11.5px;
  padding: 4px 9px;
  border-radius: 99px;
  background: var(--panel);
  border: 1px solid var(--line);
  color: var(--ink-soft);
  font-weight: 600;
  text-decoration: none;
  transition: all .15s ease;
}
.toc-pill:hover {
  border-color: var(--kotlin);
  color: var(--kotlin);
  background: var(--kotlin-dim);
}

.section-block {
  margin-bottom: 34px;
  scroll-margin-top: 120px;
}
.section-block h3 {
  font-size: 17px;
  color: var(--ink);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 9px;
}
.section-block h3 .num {
  font-family: 'JetBrains Mono';
  background: var(--kotlin-dim);
  color: var(--kotlin-text);
  width: 26px;
  height: 26px;
  border-radius: 7px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 700;
  flex-shrink: 0;
}
.section-block p {
  margin: 0 0 12px 0;
  font-size: 15px;
  line-height: 1.65;
}
.section-block b {
  color: var(--ink);
}

/* CODE TABS & CODEBOX */
.code-container {
  border: 1px solid var(--code-border);
  border-radius: var(--radius);
  overflow: hidden;
  background: var(--code-bg);
  box-shadow: var(--shadow-sm);
  margin: 12px 0;
}
.code-tabs {
  display: flex;
  background: rgba(0,0,0,0.25);
  border-bottom: 1px solid var(--code-border);
  overflow-x: auto;
}
.code-tab-btn {
  padding: 9px 16px;
  font-size: 12.5px;
  font-weight: 600;
  color: #8C93A8;
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  white-space: nowrap;
  transition: all .15s ease;
}
.code-tab-btn:hover { color: #E7E9F2; }
.code-tab-btn.active {
  color: #FFFFFF;
  border-bottom-color: var(--kotlin);
  background: rgba(127,82,255,0.08);
}
.code-tab-panel {
  display: none;
  position: relative;
}
.code-tab-panel.active { display: block; }

.codebox {
  padding: 16px 20px;
  overflow-x: auto;
  font-size: 13.5px;
  line-height: 1.65;
  color: var(--code-ink);
  margin: 0;
}
.codebox pre {
  margin: 0;
  font-family: 'JetBrains Mono', monospace;
  white-space: pre;
}

/* SYNTAX HIGHLIGHTING COLORS */
.kw { color: var(--syn-kw); font-weight: 600; }
.ann { color: var(--syn-ann); font-weight: 600; }
.str { color: var(--syn-str); }
.type { color: var(--syn-type); }
.fn { color: var(--syn-fn); }
.num { color: var(--syn-num); }
.com { color: var(--syn-com); font-style: italic; }

.copy-btn {
  position: absolute;
  top: 10px;
  right: 12px;
  background: rgba(255,255,255,0.12);
  color: #E2E6F2;
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 6px;
  padding: 5px 11px;
  font-size: 11.5px;
  font-family: 'JetBrains Mono';
  font-weight: 500;
  transition: all .15s ease;
  z-index: 5;
}
.copy-btn:hover {
  background: rgba(255,255,255,0.22);
  color: #fff;
}

/* EXPLICATION TABLE */
.explain-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13.8px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
  margin-top: 10px;
}
.explain-table th {
  text-align: left;
  background: var(--paper);
  font-size: 11.5px;
  color: var(--ink-soft);
  font-weight: 700;
  text-transform: uppercase;
  padding: 9px 14px;
  border-bottom: 1px solid var(--line);
}
.explain-table td {
  padding: 10px 14px;
  border-bottom: 1px solid var(--line);
  vertical-align: top;
}
.explain-table tr:last-child td { border-bottom: none; }
.explain-table td:first-child code {
  background: var(--kotlin-dim);
  color: var(--kotlin-text);
  padding: 2px 7px;
  border-radius: 4px;
  font-size: 12.5px;
  white-space: nowrap;
}

/* ERRORS BOXES */
.err-item {
  border: 1px solid var(--red-dim);
  background: #FFF8F8;
  border-left: 4px solid var(--red);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 12px;
}
[data-theme="dark"] .err-item {
  background: #1F1517;
  border-color: #381B1C;
}
.err-head {
  font-family: 'JetBrains Mono';
  color: var(--red);
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.err-fix {
  font-size: 13.5px;
  color: var(--ink);
  line-height: 1.55;
}

/* EXERCICE & QUIZ */
.exercise-box {
  border: 1px solid var(--amber-dim);
  background: #FFFDF8;
  border-left: 4px solid var(--amber);
  border-radius: var(--radius);
  padding: 18px 20px;
}
[data-theme="dark"] .exercise-box {
  background: #1C1811;
  border-color: #362916;
}
.exercise-title {
  font-weight: 700;
  font-size: 15px;
  color: var(--ink);
  margin-bottom: 8px;
}
.exercise-hint {
  font-size: 13.5px;
  color: var(--ink-soft);
  margin: 8px 0 14px 0;
}
.sol-btn {
  background: var(--panel);
  border: 1px solid var(--amber);
  color: var(--amber);
  padding: 6px 14px;
  border-radius: 6px;
  font-size: 12.5px;
  font-weight: 700;
  transition: all .15s ease;
}
.sol-btn:hover {
  background: var(--amber);
  color: #fff;
}
.sol-content {
  display: none;
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px dashed var(--line);
}

.quiz-box {
  border: 1px solid var(--line);
  background: var(--panel);
  border-radius: var(--radius-lg);
  padding: 22px 24px;
  box-shadow: var(--shadow-sm);
}
.quiz-q {
  font-weight: 700;
  font-size: 15.5px;
  margin-bottom: 14px;
  color: var(--ink);
}
.quiz-opt {
  display: block;
  width: 100%;
  text-align: left;
  padding: 11px 16px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--panel);
  color: var(--ink);
  margin-bottom: 8px;
  font-size: 14px;
  font-weight: 500;
  transition: all .15s ease;
}
.quiz-opt:hover:not(:disabled) {
  border-color: var(--kotlin);
  background: var(--paper);
}
.quiz-opt.correct {
  background: var(--android-dim) !important;
  border-color: var(--android) !important;
  color: var(--android) !important;
  font-weight: 700;
}
.quiz-opt.wrong {
  background: var(--red-dim) !important;
  border-color: var(--red) !important;
  color: var(--red) !important;
  font-weight: 700;
}
.quiz-fb {
  margin-top: 12px;
  padding: 12px 14px;
  border-radius: var(--radius);
  font-size: 13.5px;
  line-height: 1.5;
  display: none;
}
.quiz-fb.correct { background: var(--android-dim); color: var(--android); display: block; }
.quiz-fb.wrong { background: var(--red-dim); color: var(--red); display: block; }

.retain-list {
  list-style: none;
  margin: 0;
  padding: 0;
}
.retain-list li {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  padding: 7px 0;
  font-size: 14.5px;
}
.retain-list li::before {
  content: "✓";
  color: var(--android);
  font-weight: 800;
  font-size: 15px;
  flex-shrink: 0;
}

.lesson-nav-footer {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin-top: 40px;
  padding-top: 24px;
  border-top: 1px solid var(--line);
}
.lesson-nav-footer button {
  padding: 10px 18px;
  border-radius: var(--radius);
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--ink);
  font-size: 13.5px;
  font-weight: 600;
  transition: all .15s ease;
}
.lesson-nav-footer button:hover:not(:disabled) {
  border-color: var(--kotlin);
}
.lesson-nav-footer .finish-btn {
  background: var(--android);
  color: #fff;
  border-color: var(--android);
}
.lesson-nav-footer .finish-btn.done {
  background: var(--android-dim);
  color: var(--android);
}

/* ======================================================================
   ANDROIDS SMARTPHONE SIMULATOR
   ====================================================================== */
.phone-sim-wrap {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 24px 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  margin: 16px 0;
}
.sim-toggle-row {
  display: flex;
  gap: 8px;
  margin-bottom: 18px;
}
.sim-toggle-btn {
  padding: 6px 14px;
  border-radius: 99px;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--ink-soft);
  font-size: 12.5px;
  font-weight: 600;
  transition: all .15s ease;
}
.sim-toggle-btn.active {
  background: var(--kotlin);
  border-color: var(--kotlin);
  color: #fff;
}

/* Phone Mockup Frame */
.smartphone-device {
  width: 330px;
  min-height: 520px;
  background: #000;
  border-radius: 36px;
  padding: 10px;
  box-shadow: 0 16px 36px rgba(0,0,0,0.22), 0 0 0 4px #262933;
  display: flex;
  flex-direction: column;
  position: relative;
}
.smartphone-screen {
  flex: 1;
  background: #FDFDFE;
  color: #1A1C22;
  border-radius: 28px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  position: relative;
  font-family: 'Inter', sans-serif;
}
[data-theme="dark"] .smartphone-screen {
  background: #181A20;
  color: #ECEEF5;
}

/* Status bar */
.phone-statusbar {
  height: 26px;
  padding: 4px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 11px;
  font-weight: 700;
  color: inherit;
  opacity: 0.85;
}
.phone-notch {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #000;
}

/* App Bar inside phone */
.phone-appbar {
  background: var(--kotlin);
  color: #fff;
  padding: 10px 14px;
  font-size: 14px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

/* Phone Content Viewport */
.phone-viewport {
  flex: 1;
  padding: 14px;
  overflow-y: auto;
  font-size: 13px;
  position: relative;
}

/* Gesture bar */
.phone-navbar {
  height: 18px;
  display: flex;
  justify-content: center;
  align-items: center;
}
.phone-nav-pill {
  width: 90px;
  height: 4px;
  border-radius: 99px;
  background: rgba(0,0,0,0.35);
}
[data-theme="dark"] .phone-nav-pill {
  background: rgba(255,255,255,0.35);
}

/* Schema View */
.schema-box {
  width: 100%;
  max-width: 600px;
  background: var(--code-bg);
  color: var(--code-ink);
  padding: 18px 20px;
  border-radius: var(--radius);
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  white-space: pre;
  overflow-x: auto;
  display: none;
}

/* RESPONSIVE */
@media(max-width: 860px) {
  .sidebar {
    position: fixed;
    left: -290px;
    top: 0;
    z-index: 100;
    transition: left .2s ease;
    box-shadow: none;
  }
  .sidebar.open {
    left: 0;
    box-shadow: 0 0 0 9999px rgba(0,0,0,.5);
  }
  .menu-btn { display: flex; }
  .content { padding: 20px 16px 90px 16px; }
  .topbar { padding: 10px 16px; }
  .smartphone-device { width: 290px; min-height: 480px; }
}
</style>
</head>

<script>
/* ======================================================================
   BASE DE DONNÉES ENRICHE DE TOUTES LES LEÇONS (DE A À Z)
   ====================================================================== */
const LESSONS = {"layout": {"id": "layout", "title": "Fondations UI : Column, Row, Box & Modifier", "niveau": 2, "level": "beg", "duration": "12 min", "quoi": "En Jetpack Compose, l'interface n'est plus construite avec des fichiers XML : tout est décrit en fonctions Kotlin déclaratives. <b>Column</b> empile ses éléments verticalement, <b>Row</b> les aligne horizontalement, et <b>Box</b> les superpose les uns sur les autres (comme des calques). Le <b>Modifier</b> est l'objet universel qui permet de décorer, dimensionner, espacer et ajouter des interactions à n'importe quel composant.", "pourquoi": "Sans conteneur de disposition, Compose placerait tous les éléments au même endroit (en haut à gauche à 0,0) et ils se chevaucheraient. Maîtriser Column, Row, Box et la chaîne des Modifiers est le socle indispensable pour construire 100% des écrans d'une application Android.", "quand": "Absolument partout ! Dès que tu veux afficher deux textes l'un sous l'autre (Column), un bouton à côté d'une icône (Row), ou un badge de notification sur une photo de profil (Box).", "syntaxe": "// 1. Vertical\nColumn(\n    modifier = Modifier.fillMaxWidth().padding(16.dp),\n    verticalArrangement = Arrangement.spacedBy(8.dp),\n    horizontalAlignment = Alignment.CenterHorizontally\n) { /* enfants */ }\n\n// 2. Horizontal\nRow(\n    modifier = Modifier.fillMaxWidth(),\n    horizontalArrangement = Arrangement.SpaceBetween,\n    verticalAlignment = Alignment.CenterVertically\n) { /* enfants */ }\n\n// 3. Superposition (calques)\nBox(\n    modifier = Modifier.size(64.dp),\n    contentAlignment = Alignment.TopEnd\n) { /* enfants superposés */ }", "exempleMin": "@Composable\nfun ProfilBasique() {\n    Column(modifier = Modifier.padding(16.dp)) {\n        Text(\"Alice Dupont\", fontWeight = FontWeight.Bold)\n        Text(\"Développeuse Android\", color = Color.Gray)\n    }\n}", "explication": [["@Composable", "Indique au compilateur Compose que cette fonction génère un morceau d'interface graphique."], ["Column(modifier = ...)", "Crée un conteneur vertical. Le modifier applique une marge intérieure de 16.dp tout autour."], ["Text(\"Alice Dupont\")", "Affiche le nom en texte brut avec une graisse grasse (Bold)."], ["Text(\"Développeuse...\", color = ...)", "Deuxième texte empilé automatiquement sous le premier, avec une teinte grise atténuée."]], "exempleReel": "package com.example.app.ui\n\nimport androidx.compose.foundation.background\nimport androidx.compose.foundation.layout.*\nimport androidx.compose.foundation.shape.CircleShape\nimport androidx.compose.foundation.shape.RoundedCornerShape\nimport androidx.compose.material.icons.Icons\nimport androidx.compose.material.icons.filled.Email\nimport androidx.compose.material.icons.filled.Person\nimport androidx.compose.material3.*\nimport androidx.compose.runtime.Composable\nimport androidx.compose.ui.Alignment\nimport androidx.compose.ui.Modifier\nimport androidx.compose.ui.draw.clip\nimport androidx.compose.ui.graphics.Color\nimport androidx.compose.ui.text.font.FontWeight\nimport androidx.compose.ui.tooling.preview.Preview\nimport androidx.compose.ui.unit.dp\nimport androidx.compose.ui.unit.sp\n\n/**\n * Exemple de A à Z : Carte de Profil combinant Box (avatar + badge),\n * Column (textes verticaux) et Row (boutons d'action horizontaux).\n */\n@Composable\nfun CarteProfilComplete(\n    nom: String = \"Sarah Benali\",\n    role: String = \"Lead Mobile Architect\",\n    estEnLigne: Boolean = true,\n    onContacterClick: () -> Unit = {}\n) {\n    Card(\n        modifier = Modifier\n            .fillMaxWidth()\n            .padding(16.dp),\n        shape = RoundedCornerShape(16.dp),\n        colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surfaceVariant)\n    ) {\n        Column(\n            modifier = Modifier\n                .fillMaxWidth()\n                .padding(20.dp),\n            horizontalAlignment = Alignment.CenterHorizontally\n        ) {\n            // 1. BOX : Avatar avec badge \"En ligne\" superposé en bas à droite\n            Box(contentAlignment = Alignment.BottomEnd) {\n                // Avatar circulaire\n                Box(\n                    modifier = Modifier\n                        .size(80.dp)\n                        .clip(CircleShape)\n                        .background(MaterialTheme.colorScheme.primary),\n                    contentAlignment = Alignment.Center\n                ) {\n                    Icon(\n                        imageVector = Icons.Default.Person,\n                        contentDescription = \"Avatar\",\n                        tint = Color.White,\n                        modifier = Modifier.size(48.dp)\n                    )\n                }\n\n                // Pastille indicateur de statut\n                if (estEnLigne) {\n                    Box(\n                        modifier = Modifier\n                            .size(20.dp)\n                            .clip(CircleShape)\n                            .background(Color(0xFF3DDC84)) // Vert Android\n                            .padding(2.dp)\n                    )\n                }\n            }\n\n            Spacer(modifier = Modifier.height(12.dp))\n\n            // 2. COLUMN : Identité et titre\n            Text(\n                text = nom,\n                fontSize = 20.sp,\n                fontWeight = FontWeight.Bold,\n                color = MaterialTheme.colorScheme.onSurfaceVariant\n            )\n            Text(\n                text = role,\n                fontSize = 14.sp,\n                color = MaterialTheme.colorScheme.outline\n            )\n\n            Spacer(modifier = Modifier.height(18.dp))\n\n            // 3. ROW : Boutons d'action alignés horizontalement\n            Row(\n                modifier = Modifier.fillMaxWidth(),\n                horizontalArrangement = Arrangement.spacedBy(12.dp)\n            ) {\n                OutlinedButton(\n                    onClick = { /* Voir profil */ },\n                    modifier = Modifier.weight(1f)\n                ) {\n                    Text(\"Profil\")\n                }\n\n                Button(\n                    onClick = onContacterClick,\n                    modifier = Modifier.weight(1f)\n                ) {\n                    Icon(Icons.Default.Email, contentDescription = null, modifier = Modifier.size(16.dp))\n                    Spacer(modifier = Modifier.width(6.dp))\n                    Text(\"Message\")\n                }\n            }\n        }\n    }\n}\n\n@Preview(showBackground = true)\n@Composable\nfun CarteProfilPreview() {\n    MaterialTheme {\n        CarteProfilComplete()\n    }\n}", "gradle": "// build.gradle.kts (Module :app)\ndependencies {\n    val composeBom = platform(\"androidx.compose:compose-bom:2024.04.01\")\n    implementation(composeBom)\n    androidTestImplementation(composeBom)\n\n    implementation(\"androidx.compose.ui:ui\")\n    implementation(\"androidx.compose.ui:ui-graphics\")\n    implementation(\"androidx.compose.ui:ui-tooling-preview\")\n    implementation(\"androidx.compose.material3:material3\")\n    implementation(\"androidx.compose.material:material-icons-extended\")\n    debugImplementation(\"androidx.compose.ui:ui-tooling\")\n}", "resultat": "┌─────────────────────────────────┐\n│              [ 👤 ]🟢           │  ← Box (Avatar + Badge superposé)\n│           Sarah Benali          │  ← Column (Textes empilés)\n│       Lead Mobile Architect     │\n│                                 │\n│  [  Profil  ]   [ ✉ Message ]   │  ← Row (Boutons côte à côte)\n└─────────────────────────────────┘", "params": [["horizontalAlignment", "Dans Column : aligne les enfants sur l'axe horizontal (Start, CenterHorizontally, End)."], ["verticalArrangement", "Dans Column : répartit l'espace vertical (Top, Center, Bottom, SpaceBetween, Arrangement.spacedBy(x.dp))."], ["horizontalArrangement", "Dans Row : répartit l'espace horizontal (Start, Center, End, SpaceBetween, Arrangement.spacedBy(x.dp))."], ["verticalAlignment", "Dans Row : aligne les enfants sur l'axe vertical (Top, CenterVertically, Bottom)."], ["contentAlignment", "Dans Box : positionne les enfants à l'intérieur (TopStart, Center, BottomEnd, etc.)."], ["Modifier.weight(1f)", "Dans Row/Column : distribue l'espace restant proportionnellement (équivalent de flexbox)."], ["Modifier.fillMaxWidth()", "Occupe 100% de la largeur disponible offerte par le parent."]], "erreurs": [["Ordre des Modifiers inversé : Modifier.padding(16.dp).background(Color.Red)", "L'ordre des modificateurs est strict en Compose ! Ici le padding est externe (marge), puis le fond rouge est appliqué à l'intérieur. Pour avoir un fond rouge avec marge intérieure, écris toujours : .background(Color.Red).padding(16.dp)."], ["Utiliser Column classique pour une liste de 500 éléments", "Un Column standard instancie TOUS ses enfants en mémoire immédiatement, ce qui provoque des saccades d'écran et des plantages OutOfMemoryError. Pour toute liste longue ou dynamique, utilise une LazyColumn !"]], "exercice": {"enonce": "Crée un composant d'élément de notification : une Row avec un badge numérique circulaire à gauche (Box violette et chiffre blanc), un titre et sous-titre empilés au centre (Column avec Modifier.weight(1f)), et une flèche à droite.", "indice": "Utilise Row(verticalAlignment = CenterVertically) contenant Box(size=36.dp, clip=CircleShape), un Spacer(12.dp), un Column(Modifier.weight(1f)), et un Icon chevron.", "solution": "@Composable\nfun ItemNotification(\n    numero: Int = 1,\n    titre: String = \"Mise à jour disponible\",\n    description: String = \"La version 2.4 apporte des nouveautés.\"\n) {\n    Row(\n        modifier = Modifier\n            .fillMaxWidth()\n            .padding(12.dp),\n        verticalAlignment = Alignment.CenterVertically\n    ) {\n        // Badge circulaire\n        Box(\n            modifier = Modifier\n                .size(36.dp)\n                .clip(CircleShape)\n                .background(Color(0xFF7F52FF)),\n            contentAlignment = Alignment.Center\n        ) {\n            Text(text = \"$numero\", color = Color.White, fontWeight = FontWeight.Bold)\n        }\n\n        Spacer(modifier = Modifier.width(12.dp))\n\n        // Textes centraux occupant l'espace restant\n        Column(modifier = Modifier.weight(1f)) {\n            Text(text = titre, fontWeight = FontWeight.SemiBold, fontSize = 15.sp)\n            Text(text = description, color = Color.Gray, fontSize = 13.sp)\n        }\n\n        // Flèche\n        Icon(\n            imageVector = Icons.Default.ChevronRight,\n            contentDescription = \"Voir\",\n            tint = Color.Gray\n        )\n    }\n}"}, "quiz": {"q": "Quelle est la différence concrète entre Modifier.background(Color.Blue).padding(16.dp) et Modifier.padding(16.dp).background(Color.Blue) ?", "options": ["Le premier applique la couleur sur toute la surface y compris le padding ; le second crée une marge transparente autour du bloc bleu", "C'est strictement identique, Compose réorganise automatiquement l'ordre", "Le second provoque une erreur de compilation Kotlin", "Le premier est interdit en Material Design 3"], "correct": 0, "exp": "En Jetpack Compose, les modificateurs s'exécutent de gauche à droite (dans l'ordre de chaînage). Background puis Padding colore la surface avant d'insérer l'espace intérieur, tandis que Padding puis Background crée un espacement externe (marge) avant de colorer la zone réduite restante."}, "retenir": ["Column = empilement vertical ; Row = alignement horizontal ; Box = calques superposés.", "L'ordre des Modifiers est capital : padding avant background = marge externe ; padding après background = marge interne.", "Modifier.weight(1f) dans Row/Column permet d'étirer un composant pour occuper l'espace restant disponible.", "Arrangement gère la distribution le long de l'axe principal ; Alignment gère l'alignement sur l'axe secondaire."], "prereq": ["Kotlin de base", "Fonctions"], "suite": ["card", "scaffold"]}, "card": {"id": "card", "title": "Créer une Card Material 3", "niveau": 2, "level": "beg", "duration": "10 min", "quoi": "Une <b>Card</b> (Carte) Material 3 est un conteneur visuel avec coins arrondis, une surface de couleur dédiée et une légère élévation ou bordure. Elle sert à regrouper des informations liées (titre, image, prix, bouton) en une entité visuelle cohérente.", "pourquoi": "Sans Card, les informations flottent sur l'écran sans délimitation claire. La Card crée un repère visuel immédiat pour l'utilisateur, qui perçoit le bloc comme un objet unique cliquable ou manipulable (comme une carte à jouer physique).", "quand": "Pour afficher une fiche produit e-commerce, une carte de contact, un article de blog dans un flux d'actualités, ou un bloc de statistiques dans un tableau de bord.", "syntaxe": "// Syntaxe standard Material 3\nCard(\n    modifier = Modifier.fillMaxWidth().padding(8.dp),\n    shape = RoundedCornerShape(16.dp),\n    colors = CardDefaults.cardColors(\n        containerColor = MaterialTheme.colorScheme.surfaceVariant\n    ),\n    elevation = CardDefaults.cardElevation(defaultElevation = 4.dp),\n    onClick = { /* Action au clic */ }\n) {\n    // Contenu interne (souvent une Column ou Row)\n}", "exempleMin": "@Composable\nfun CarteSimple() {\n    Card(modifier = Modifier.padding(16.dp)) {\n        Column(modifier = Modifier.padding(16.dp)) {\n            Text(\"Titre de la carte\", fontWeight = FontWeight.Bold)\n            Text(\"Description courte du contenu.\")\n        }\n    }\n}", "explication": [["Card(modifier = ...)", "Ouvre le conteneur de carte Material 3 avec coins arrondis et ombre portée."], ["Column(modifier = Modifier.padding(16.dp))", "CRITIQUE : La Card ne fournit aucune marge interne par défaut. Il faut TOUJOURS ajouter un padding sur le conteneur interne pour que le texte ne colle pas aux bords."], ["Text(\"Titre de la carte\")", "Affiche le titre mis en gras."], ["Text(\"Description...\")", "Affiche le texte secondaire en dessous."]], "exempleReel": "package com.example.app.ui\n\nimport androidx.compose.foundation.Image\nimport androidx.compose.foundation.layout.*\nimport androidx.compose.foundation.shape.RoundedCornerShape\nimport androidx.compose.material.icons.Icons\nimport androidx.compose.material.icons.filled.Favorite\nimport androidx.compose.material.icons.filled.ShoppingCart\nimport androidx.compose.material.icons.outlined.FavoriteBorder\nimport androidx.compose.material3.*\nimport androidx.compose.runtime.*\nimport androidx.compose.ui.Alignment\nimport androidx.compose.ui.Modifier\nimport androidx.compose.ui.draw.clip\nimport androidx.compose.ui.graphics.Color\nimport androidx.compose.ui.layout.ContentScale\nimport androidx.compose.ui.res.painterResource\nimport androidx.compose.ui.text.font.FontWeight\nimport androidx.compose.ui.text.style.TextDecoration\nimport androidx.compose.ui.tooling.preview.Preview\nimport androidx.compose.ui.unit.dp\nimport androidx.compose.ui.unit.sp\n\n/**\n * Exemple de A à Z : Fiche Produit E-Commerce complète Material 3\n * Avec gestion d'un favori, calcul de promotion et bouton d'ajout au panier.\n */\n@Composable\nfun FicheProduitCard(\n    nom: String = \"Casque Bluetooth ANC\",\n    prixInitial: Double = 149.99,\n    prixPromo: Double = 99.99,\n    onAjouterAuPanier: () -> Unit = {}\n) {\n    var estFavori by remember { mutableStateOf(false) }\n\n    Card(\n        modifier = Modifier\n            .fillMaxWidth()\n            .padding(16.dp),\n        shape = RoundedCornerShape(20.dp),\n        elevation = CardDefaults.cardElevation(defaultElevation = 6.dp),\n        colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface)\n    ) {\n        Column(modifier = Modifier.padding(16.dp)) {\n            // En-tête : Badge Promo + Bouton Favori\n            Row(\n                modifier = Modifier.fillMaxWidth(),\n                horizontalArrangement = Arrangement.SpaceBetween,\n                verticalAlignment = Alignment.CenterVertically\n            ) {\n                Surface(\n                    shape = RoundedCornerShape(8.dp),\n                    color = Color(0xFFC4453A) // Rouge remise\n                ) {\n                    Text(\n                        text = \"-33% PROMO\",\n                        color = Color.White,\n                        fontSize = 11.sp,\n                        fontWeight = FontWeight.Bold,\n                        modifier = Modifier.padding(horizontal = 8.dp, vertical = 4.dp)\n                    )\n                }\n\n                IconButton(onClick = { estFavori = !estFavori }) {\n                    Icon(\n                        imageVector = if (estFavori) Icons.Filled.Favorite else Icons.Outlined.FavoriteBorder,\n                        contentDescription = \"Favori\",\n                        tint = if (estFavori) Color.Red else Color.Gray\n                    )\n                }\n            }\n\n            Spacer(modifier = Modifier.height(8.dp))\n\n            // Titre du produit\n            Text(\n                text = nom,\n                fontSize = 18.sp,\n                fontWeight = FontWeight.Bold,\n                color = MaterialTheme.colorScheme.onSurface\n            )\n\n            Spacer(modifier = Modifier.height(4.dp))\n\n            // Prix barré et prix promo\n            Row(verticalAlignment = Alignment.CenterVertically) {\n                Text(\n                    text = \"$prixPromo €\",\n                    fontSize = 22.sp,\n                    fontWeight = FontWeight.ExtraBold,\n                    color = Color(0xFF1E8F72) // Vert succès\n                )\n                Spacer(modifier = Modifier.width(8.dp))\n                Text(\n                    text = \"$prixInitial €\",\n                    fontSize = 14.sp,\n                    color = Color.Gray,\n                    textDecoration = TextDecoration.LineThrough\n                )\n            }\n\n            Spacer(modifier = Modifier.height(16.dp))\n\n            // Bouton pleine largeur\n            Button(\n                onClick = onAjouterAuPanier,\n                modifier = Modifier.fillMaxWidth(),\n                shape = RoundedCornerShape(12.dp),\n                colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF7F52FF))\n            ) {\n                Icon(Icons.Default.ShoppingCart, contentDescription = null, modifier = Modifier.size(18.dp))\n                Spacer(modifier = Modifier.width(8.dp))\n                Text(\"Ajouter au panier\", fontWeight = FontWeight.SemiBold)\n            }\n        }\n    }\n}\n\n@Preview(showBackground = true)\n@Composable\nfun FicheProduitPreview() {\n    MaterialTheme {\n        FicheProduitCard()\n    }\n}", "gradle": "// build.gradle.kts (Module :app)\ndependencies {\n    implementation(platform(\"androidx.compose:compose-bom:2024.04.01\"))\n    implementation(\"androidx.compose.material3:material3\")\n    implementation(\"androidx.compose.material:material-icons-extended\")\n}", "resultat": "┌──────────────────────────────────────┐\n│ [-33% PROMO]                    [ ♡ ]│\n│                                      │\n│ Casque Bluetooth ANC                 │\n│ 99.99 €  ~~149.99 €~~                │\n│                                      │\n│ [ 🛒 Ajouter au panier             ] │\n└──────────────────────────────────────┘", "params": [["modifier", "Contrôle les dimensions, marges extérieures (padding), clics et accessibilité."], ["shape", "Définit le rayon des coins : RoundedCornerShape(16.dp) ou CircleShape."], ["colors", "Couleurs via CardDefaults.cardColors(containerColor = ..., contentColor = ...)."], ["elevation", "Ombre via CardDefaults.cardElevation(defaultElevation = 4.dp, pressedElevation = 8.dp)."], ["border", "Bordure extérieure fine via BorderStroke(1.dp, Color.LightGray) pour une OutlinedCard."], ["onClick", "Rend la carte entière cliquable avec animation d'onde Material ripple."]], "erreurs": [["Le contenu touche exactement les bords extérieurs de la carte", "La Card n'applique aucune marge intérieure par défaut. Tu dois impérativement mettre Modifier.padding(...) sur la Column ou Row placée à l'intérieur."], ["La Card s'étend sur toute la hauteur de l'écran par erreur", "Évite de mettre Modifier.fillMaxHeight() sur une Card isolée sauf si c'est explicitement voulu (ex: carte de modal plein écran)."]], "exercice": {"enonce": "Crée une carte de recette culinaire : image ou pastille en haut, titre en gras, temps de préparation ('⏱ 25 min') et niveau ('Facile') alignés dans une Row, et un bouton 'Commencer'.", "indice": "Compose : Card { Column(padding) { Text(Titre) ; Row { Text(Temps) ; Text(Niveau) } ; Button } }", "solution": "@Composable\nfun CarteRecette(\n    titre: String = \"Pâtes Carbonara Traditionnelles\",\n    duree: String = \"20 min\",\n    difficulte: String = \"Facile\"\n) {\n    Card(\n        modifier = Modifier.fillMaxWidth().padding(12.dp),\n        shape = RoundedCornerShape(16.dp)\n    ) {\n        Column(modifier = Modifier.padding(16.dp)) {\n            Text(text = titre, fontSize = 18.sp, fontWeight = FontWeight.Bold)\n            Spacer(modifier = Modifier.height(8.dp))\n            Row(\n                modifier = Modifier.fillMaxWidth(),\n                horizontalArrangement = Arrangement.SpaceBetween\n            ) {\n                Text(text = \"⏱ $duree\", color = Color.Gray, fontSize = 14.sp)\n                Text(text = \"⭐ $difficulte\", color = Color(0xFFD98A1B), fontWeight = FontWeight.Medium)\n            }\n            Spacer(modifier = Modifier.height(14.dp))\n            Button(\n                onClick = { /* Lancer */ },\n                modifier = Modifier.fillMaxWidth()\n            ) {\n                Text(\"Commencer la recette\")\n            }\n        }\n    }\n}"}, "quiz": {"q": "Pourquoi est-il indispensable d'ajouter un Modifier.padding() sur la Column enfant à l'intérieur d'une Card ?", "options": ["Parce que la Card Compose ne fournit aucun padding intérieur par défaut", "Pour rendre la Card cliquable", "Pour activer l'élévation de la carte", "C'est une obligation imposée par le compilateur Kotlin"], "correct": 0, "exp": "Contrairement à certains composants d'autres frameworks, la Card de Jetpack Compose ne définit aucune marge intérieure par défaut. Sans padding explicite sur le conteneur interne, les textes et boutons touchent directement les bords arrondis de la carte."}, "retenir": ["Card = conteneur Material 3 avec coins arrondis et élévation.", "Ajoute TOUJOURS un padding intérieur sur le premier enfant de la Card.", "CardDefaults.cardColors() et CardDefaults.cardElevation() permettent de personnaliser l'apparence.", "Existe en trois variantes Material 3 : Card (élévée), OutlinedCard (avec bordure), et ElevatedCard."], "prereq": ["layout"], "suite": ["lazycolumn", "scaffold"]}, "scaffold": {"id": "scaffold", "title": "Structure d'Écran : Scaffold & TopAppBar", "niveau": 3, "level": "beg", "duration": "14 min", "quoi": "Le <b>Scaffold</b> (échafaudage) est le composant d'architecture d'écran standard de Material Design 3. Il fournit les emplacements prédéfinis (slots) pour la barre supérieure (<b>TopAppBar</b>), la barre de navigation inférieure (<b>NavigationBar</b>), le bouton d'action flottant (<b>FloatingActionButton</b>) et la bannière d'alerte (<b>SnackbarHost</b>).", "pourquoi": "Sans Scaffold, tu devrais calculer manuellement les hauteurs, positionner la barre d'action au bon endroit, gérer la superposition des notifications éphémères (Snackbars) et éviter que ton contenu ne passe sous la barre de statut de l'appareil. Scaffold orchestre tout cela proprement.", "quand": "Sur 100% des écrans principaux d'une application Android ! C'est le composant racine de chaque écran.", "syntaxe": "Scaffold(\n    topBar = {\n        TopAppBar(title = { Text(\"Mon Titre\") })\n    },\n    floatingActionButton = {\n        FloatingActionButton(onClick = { }) { Icon(Icons.Default.Add, null) }\n    },\n    snackbarHost = { SnackbarHost(snackbarHostState) },\n    bottomBar = { /* Barre de navigation */ }\n) { innerPadding ->\n    // ATTENTION : innerPadding doit être appliqué au contenu !\n    Box(modifier = Modifier.padding(innerPadding)) {\n        // Contenu principal de l'écran\n    }\n}", "exempleMin": "@OptIn(ExperimentalMaterial3Api::class)\n@Composable\nfun EcranBasique() {\n    Scaffold(\n        topBar = { TopAppBar(title = { Text(\"Accueil\") }) }\n    ) { paddingValues ->\n        Text(\n            text = \"Bonjour tout le monde !\",\n            modifier = Modifier.padding(paddingValues)\n        )\n    }\n}", "explication": [["Scaffold(...) { innerPadding -> ... }", "Crée la structure d'écran. La lambda fournit `innerPadding`, qui contient la hauteur exacte de la TopBar et des barres système."], ["topBar = { TopAppBar(...) }", "Définit la barre d'en-tête de l'écran avec le titre et éventuellement des boutons d'actions."], ["Modifier.padding(innerPadding)", "OBLIGATOIRE : Si tu n'appliques pas innerPadding sur ton conteneur, ton contenu se dessinera EN DESSOUS de la barre supérieure et sera masqué !"]], "exempleReel": "package com.example.app.ui\n\nimport androidx.compose.foundation.layout.*\nimport androidx.compose.material.icons.Icons\nimport androidx.compose.material.icons.filled.Add\nimport androidx.compose.material.icons.filled.Menu\nimport androidx.compose.material.icons.filled.Search\nimport androidx.compose.material3.*\nimport androidx.compose.runtime.*\nimport androidx.compose.ui.Alignment\nimport androidx.compose.ui.Modifier\nimport androidx.compose.ui.graphics.Color\nimport androidx.compose.ui.text.font.FontWeight\nimport androidx.compose.ui.tooling.preview.Preview\nimport androidx.compose.ui.unit.dp\nimport androidx.compose.ui.unit.sp\nimport kotlinx.coroutines.launch\n\n/**\n * Exemple de A à Z : Écran complet avec Scaffold Material 3,\n * TopAppBar, FloatingActionButton et déclenchement d'un Snackbar asynchrone.\n */\n@OptIn(ExperimentalMaterial3Api::class)\n@Composable\nfun EcranPrincipalComplet() {\n    // 1. Gestion de l'état du Snackbar et de la coroutine\n    val snackbarHostState = remember { SnackbarHostState() }\n    val coroutineScope = rememberCoroutineScope()\n    var nombreArticles by remember { mutableStateOf(3) }\n\n    Scaffold(\n        snackbarHost = { SnackbarHost(snackbarHostState) },\n        topBar = {\n            TopAppBar(\n                title = { Text(\"Mes Notes\", fontWeight = FontWeight.Bold) },\n                navigationIcon = {\n                    IconButton(onClick = { /* Ouvrir Drawer */ }) {\n                        Icon(Icons.Default.Menu, contentDescription = \"Menu\")\n                    }\n                },\n                actions = {\n                    IconButton(onClick = { /* Rechercher */ }) {\n                        Icon(Icons.Default.Search, contentDescription = \"Rechercher\")\n                    }\n                },\n                colors = TopAppBarDefaults.topAppBarColors(\n                    containerColor = MaterialTheme.colorScheme.primaryContainer,\n                    titleContentColor = MaterialTheme.colorScheme.onPrimaryContainer\n                )\n            )\n        },\n        floatingActionButton = {\n            FloatingActionButton(\n                onClick = {\n                    nombreArticles++\n                    coroutineScope.launch {\n                        snackbarHostState.showSnackbar(\n                            message = \"Nouvelle note #$nombreArticles créée !\",\n                            actionLabel = \"OK\",\n                            duration = SnackbarDuration.Short\n                        )\n                    }\n                },\n                containerColor = Color(0xFF7F52FF),\n                contentColor = Color.White\n            ) {\n                Icon(Icons.Default.Add, contentDescription = \"Ajouter\")\n            }\n        },\n        floatingActionButtonPosition = FabPosition.End\n    ) { innerPadding ->\n        // Contenu de la page recevant impérativement innerPadding\n        Column(\n            modifier = Modifier\n                .fillMaxSize()\n                .padding(innerPadding)\n                .padding(16.dp),\n            verticalArrangement = Arrangement.spacedBy(12.dp)\n        ) {\n            Text(\n                text = \"Total des notes enregistrées : $nombreArticles\",\n                fontSize = 16.sp,\n                fontWeight = FontWeight.Medium\n            )\n\n            repeat(nombreArticles) { index ->\n                Card(\n                    modifier = Modifier.fillMaxWidth(),\n                    colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surfaceVariant)\n                ) {\n                    Text(\n                        text = \"Note numéro ${index + 1} : Rappel important\",\n                        modifier = Modifier.padding(16.dp)\n                    )\n                }\n            }\n        }\n    }\n}\n\n@Preview(showBackground = true)\n@Composable\nfun EcranPrincipalPreview() {\n    MaterialTheme {\n        EcranPrincipalComplet()\n    }\n}", "gradle": "// build.gradle.kts (Module :app)\ndependencies {\n    implementation(platform(\"androidx.compose:compose-bom:2024.04.01\"))\n    implementation(\"androidx.compose.material3:material3\")\n    implementation(\"androidx.compose.material:material-icons-extended\")\n    implementation(\"org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0\")\n}", "resultat": "┌──────────────────────────────────────┐\n│ [≡] Mes Notes                    [🔍]│  ← TopAppBar\n├──────────────────────────────────────┤\n│ Total des notes enregistrées : 3     │\n│ ┌──────────────────────────────────┐ │\n│ │ Note numéro 1 : Rappel important │ │\n│ └──────────────────────────────────┘ │\n│ ┌──────────────────────────────────┐ │\n│ │ Note numéro 2 : Rappel important │ │\n│ └──────────────────────────────────┘ │\n│                                      │\n│                                [ + ] │  ← FloatingActionButton\n│ ┌──────────────────────────────────┐ │\n│ │ Nouvelle note #4 créée !    [OK] │ │  ← SnackbarHost\n└─┴──────────────────────────────────┴─┘", "params": [["topBar", "Slot recevant le composant d'en-tête (généralement TopAppBar, CenterAlignedTopAppBar, LargeTopAppBar)."], ["bottomBar", "Slot recevant la barre de navigation basse (NavigationBar avec des NavigationBarItem)."], ["snackbarHost", "Composant récepteur gérant l'apparition animée des bannières Snackbar via SnackbarHostState."], ["floatingActionButton", "Bouton d'action proéminent (FAB) flottant au-dessus du contenu."], ["floatingActionButtonPosition", "Position du FAB : FabPosition.End (droite par défaut) ou FabPosition.Center."], ["innerPadding", "PaddingValues fournies par la lambda de Scaffold pour compenser les barres et insets système."]], "erreurs": [["Le contenu principal est masqué derrière la TopAppBar", "C'est l'erreur la plus fréquente : tu as oublié d'appliquer le paramètre `innerPadding` fourni par la lambda de Scaffold via `Modifier.padding(innerPadding)` sur le composant racine."], ["Calling showSnackbar outside a coroutine", "La fonction `snackbarHostState.showSnackbar()` est une `suspend fun`. Elle doit impérativement être appelée dans une Coroutine via `coroutineScope.launch { ... }`."]], "exercice": {"enonce": "Ajoute une TopAppBar centrée (CenterAlignedTopAppBar) avec un titre 'Mon Profil' et une icône de cadenas verrouillé à droite.", "indice": "Utilise CenterAlignedTopAppBar(title = { Text('Mon Profil') }, actions = { IconButton { Icon(Icons.Default.Lock) } })", "solution": "@OptIn(ExperimentalMaterial3Api::class)\n@Composable\nfun EcranProfilScaffold() {\n    Scaffold(\n        topBar = {\n            CenterAlignedTopAppBar(\n                title = { Text(\"Mon Profil\", fontWeight = FontWeight.Bold) },\n                actions = {\n                    IconButton(onClick = { }) {\n                        Icon(Icons.Default.Lock, contentDescription = \"Sécurité\")\n                    }\n                }\n            )\n        }\n    ) { padding ->\n        Box(modifier = Modifier.fillMaxSize().padding(padding), contentAlignment = Alignment.Center) {\n            Text(\"Informations du compte\")\n        }\n    }\n}"}, "quiz": {"q": "Que se passe-t-il si l'on ignore le paramètre `innerPadding` fourni par le Scaffold ?", "options": ["Le contenu démarre au tout début de l'écran (y=0) et se retrouve caché sous la TopAppBar", "Le Scaffold lève une exception et fait planter l'application", "La TopAppBar disparaît automatiquement", "Les boutons du Scaffold deviennent inactifs"], "correct": 0, "exp": "Scaffold superpose la TopBar et le contenu dans un conteneur Box interne. Si tu n'appliques pas `Modifier.padding(innerPadding)` sur ton contenu, celui-ci commence tout en haut de l'écran et passe derrière la TopAppBar."}, "retenir": ["Scaffold est le squelette de tout écran Android moderne Material 3.", "Il regroupe : topBar, bottomBar, snackbarHost et floatingActionButton.", "Tu dois TOUJOURS appliquer `Modifier.padding(innerPadding)` au contenu principal.", "Pour afficher un Snackbar, utilise `rememberCoroutineScope` et `snackbarHostState.showSnackbar()`."], "prereq": ["layout"], "suite": ["lazycolumn", "navigation"]}, "lazycolumn": {"id": "lazycolumn", "title": "Listes Défilantes Performantes (LazyColumn)", "niveau": 3, "level": "beg", "duration": "15 min", "quoi": "<b>LazyColumn</b> est le composant de défilement vertical paresseux (« lazy ») de Jetpack Compose. Contrairement à un Column classique, il ne compose et ne dessine à l'écran que les éléments actuellement visibles dans la zone d'affichage du téléphone, recyclant les ressources pour garantir une fluidité parfaite à 60/120 images par seconde.", "pourquoi": "Si tu as une liste de 1 000 articles ou messages, un simple Column créerait 1 000 vues en mémoire dès l'ouverture de la page, bloquant le smartphone. LazyColumn est l'équivalent moderne du `RecyclerView` classique d'Android, sans aucun code boilerplate (fini les Adapters et ViewHolders !).", "quand": "Dès que tu affiches une collection de données de taille inconnue, dynamique ou supérieure à 10 éléments : fils de réseaux sociaux, catalogues e-commerce, boîtes de réception d'emails, résultats de recherche.", "syntaxe": "LazyColumn(\n    modifier = Modifier.fillMaxSize(),\n    contentPadding = PaddingValues(16.dp),\n    verticalArrangement = Arrangement.spacedBy(8.dp)\n) {\n    // 1. Un item unique\n    item { EnTeteSection() }\n\n    // 2. Une liste dynamique d'objets\n    items(\n        items = listeObjets,\n        key = { it.id } // Clé stable indispensable\n    ) { objet ->\n        ItemVue(objet)\n    }\n}", "exempleMin": "@Composable\nfun ListeNoms(noms: List<String>) {\n    LazyColumn {\n        items(noms) { nom ->\n            Text(text = nom, modifier = Modifier.padding(12.dp))\n        }\n    }\n}", "explication": [["LazyColumn { ... }", "Initialise la liste défilante paresseuse."], ["items(noms) { nom -> ... }", "Itère sur la collection `noms` et génère un Composable à la volée pour chaque élément visible."], ["Text(text = nom)", "Affiche l'élément courant pendant le défilement."]], "exempleReel": "package com.example.app.ui\n\nimport androidx.compose.foundation.ExperimentalFoundationApi\nimport androidx.compose.foundation.background\nimport androidx.compose.foundation.layout.*\nimport androidx.compose.foundation.lazy.LazyColumn\nimport androidx.compose.foundation.lazy.items\nimport androidx.compose.foundation.shape.RoundedCornerShape\nimport androidx.compose.material.icons.Icons\nimport androidx.compose.material.icons.filled.Delete\nimport androidx.compose.material.icons.filled.Phone\nimport androidx.compose.material3.*\nimport androidx.compose.runtime.*\nimport androidx.compose.ui.Alignment\nimport androidx.compose.ui.Modifier\nimport androidx.compose.ui.graphics.Color\nimport androidx.compose.ui.text.font.FontWeight\nimport androidx.compose.ui.tooling.preview.Preview\nimport androidx.compose.ui.unit.dp\nimport androidx.compose.ui.unit.sp\n\n// 1. Modèle de données\ndata class Contact(val id: Int, val nom: String, val telephone: String, val groupe: String)\n\n/**\n * Exemple de A à Z : Annuaire téléphonique avec LazyColumn,\n * en-têtes collants (stickyHeader), clés stables et suppression animée.\n */\n@OptIn(ExperimentalFoundationApi::class)\n@Composable\nfun AnnuaireContactsComplet() {\n    var contacts by remember {\n        mutableStateOf(\n            listOf(\n                Contact(1, \"Alice Dubois\", \"06 12 34 56 78\", \"Famille\"),\n                Contact(2, \"Antoine Martin\", \"07 98 76 54 32\", \"Famille\"),\n                Contact(3, \"Béatrice Roux\", \"06 45 67 89 01\", \"Amis\"),\n                Contact(4, \"Bernard Henry\", \"06 22 33 44 55\", \"Amis\"),\n                Contact(5, \"Claire Petit\", \"07 11 22 33 44\", \"Travail\"),\n                Contact(6, \"Damien Vallet\", \"06 99 88 77 66\", \"Travail\")\n            )\n        )\n    }\n\n    // Regroupement par catégorie\n    val contactsParGroupe = contacts.groupBy { it.groupe }\n\n    LazyColumn(\n        modifier = Modifier.fillMaxSize(),\n        contentPadding = PaddingValues(16.dp),\n        verticalArrangement = Arrangement.spacedBy(8.dp)\n    ) {\n        contactsParGroupe.forEach { (groupe, listeDuGroupe) ->\n            // En-tête de groupe collant lors du défilement\n            stickyHeader {\n                Surface(\n                    modifier = Modifier.fillMaxWidth(),\n                    color = MaterialTheme.colorScheme.primaryContainer,\n                    shape = RoundedCornerShape(8.dp)\n                ) {\n                    Text(\n                        text = \"Catégorie : $groupe (${listeDuGroupe.size})\",\n                        modifier = Modifier.padding(horizontal = 12.dp, vertical = 6.dp),\n                        fontWeight = FontWeight.Bold,\n                        color = MaterialTheme.colorScheme.onPrimaryContainer\n                    )\n                }\n            }\n\n            // Éléments de la liste avec clé stable obligatoire\n            items(\n                items = listeDuGroupe,\n                key = { contact -> contact.id }\n            ) { contact ->\n                Card(\n                    modifier = Modifier.fillMaxWidth(),\n                    colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface)\n                ) {\n                    Row(\n                        modifier = Modifier\n                            .fillMaxWidth()\n                            .padding(14.dp),\n                        verticalAlignment = Alignment.CenterVertically\n                    ) {\n                        Icon(\n                            imageVector = Icons.Default.Phone,\n                            contentDescription = null,\n                            tint = Color(0xFF7F52FF),\n                            modifier = Modifier.size(24.dp)\n                        )\n\n                        Spacer(modifier = Modifier.width(12.dp))\n\n                        Column(modifier = Modifier.weight(1f)) {\n                            Text(text = contact.nom, fontWeight = FontWeight.SemiBold, fontSize = 15.sp)\n                            Text(text = contact.telephone, color = Color.Gray, fontSize = 13.sp)\n                        }\n\n                        IconButton(onClick = {\n                            contacts = contacts.filter { it.id != contact.id }\n                        }) {\n                            Icon(Icons.Default.Delete, contentDescription = \"Supprimer\", tint = Color.Red.copy(alpha = 0.7f))\n                        }\n                    }\n                }\n            }\n        }\n    }\n}\n\n@Preview(showBackground = true)\n@Composable\nfun AnnuairePreview() {\n    MaterialTheme {\n        AnnuaireContactsComplet()\n    }\n}", "gradle": "// build.gradle.kts (Module :app)\ndependencies {\n    implementation(platform(\"androidx.compose:compose-bom:2024.04.01\"))\n    implementation(\"androidx.compose.foundation:foundation\")\n    implementation(\"androidx.compose.material3:material3\")\n}", "resultat": "[ Catégorie : Famille (2) ]  ← stickyHeader (reste fixé)\n┌──────────────────────────────────────┐\n│ 📞 Alice Dubois         06 12... [🗑]│\n├──────────────────────────────────────┤\n│ 📞 Antoine Martin       07 98... [🗑]│\n└──────────────────────────────────────┘\n[ Catégorie : Amis (2) ]\n┌──────────────────────────────────────┐\n│ 📞 Béatrice Roux        06 45... [🗑]│\n└──────────────────────────────────────┘\n     ↓ (Défilement fluide de 10 000 items)", "params": [["items(list, key = { it.id })", "Itère sur la liste. Le paramètre `key` identifie chaque item de manière stable pour optimiser les animations et la mémoire."], ["item { }", "Insère un élément unique non issu d'une liste (ex: un titre de section, un bandeau publicitaire, un loader)."], ["contentPadding", "Applique des marges intérieures globales sans rogner le défilement sous les barres de statut."], ["verticalArrangement", "Définit l'espacement automatique entre items : Arrangement.spacedBy(10.dp)."], ["stickyHeader { }", "Crée un en-tête qui reste collé en haut de l'écran tant que ses enfants défilent."], ["LazyRow", "Variante pour un défilement horizontal (ex: carrousel d'histoires ou de catégories)."]], "erreurs": [["Crash : IllegalStateException: Vertically scrollable component was measured with an infinity height", "Cette erreur se produit quand tu mets une `LazyColumn` à l'intérieur d'un `Column(Modifier.verticalScroll())`. Les deux conteneurs tentent de gérer le scroll infini en même temps. SOLUTION : Supprime le `verticalScroll()` du parent !"], ["Oublier la clé unique `key = { it.id }`", "Sans clé, lors de la suppression d'un élément, Compose ne sait pas quel Composable recycler : l'état interne des champs ou cases à cocher sera décalé sur l'élément voisin, provoquant des bugs visuels majeurs."]], "exercice": {"enonce": "Affiche une liste de 20 tâches numérotées ('Tâche #1', 'Tâche #2'...). Chaque tâche doit être une Card avec une Checkbox pour marquer si elle est faite.", "indice": "Crée une data class Tache(val id: Int, val titre: String, val faite: Boolean), puis items(taches, key = { it.id }) avec une Row contenant Text et Checkbox.", "solution": "data class TacheItem(val id: Int, val titre: String, val terminee: Boolean = false)\n\n@Composable\nfun ListeTachesDemo() {\n    var taches by remember {\n        mutableStateOf((1..20).map { TacheItem(it, \"Tâche importante #$it\") })\n    }\n\n    LazyColumn(\n        modifier = Modifier.fillMaxSize(),\n        contentPadding = PaddingValues(16.dp),\n        verticalArrangement = Arrangement.spacedBy(8.dp)\n    ) {\n        items(taches, key = { it.id }) { tache ->\n            Card(modifier = Modifier.fillMaxWidth()) {\n                Row(\n                    modifier = Modifier.fillMaxWidth().padding(12.dp),\n                    horizontalArrangement = Arrangement.SpaceBetween,\n                    verticalAlignment = Alignment.CenterVertically\n                ) {\n                    Text(tache.titre, fontWeight = FontWeight.Medium)\n                    Checkbox(\n                        checked = tache.terminee,\n                        onCheckedChange = { isChecked ->\n                            taches = taches.map { if (it.id == tache.id) it.copy(terminee = isChecked) else it }\n                        }\n                    )\n                }\n            }\n        }\n    }\n}"}, "quiz": {"q": "Pourquoi est-il primordial de renseigner le paramètre `key = { it.id }` dans la fonction items() d'une LazyColumn ?", "options": ["Pour permettre à Compose de suivre avec certitude chaque élément lors des ajouts, suppressions et réorganisations", "Pour trier automatiquement la liste par ordre alphabétique", "C'est indispensable pour que le scroll fonctionne", "Pour crypter les données affichées à l'écran"], "correct": 0, "exp": "Le paramètre `key` fournit un identifiant stable et unique. Sans lui, Compose utilise la position de l'élément (0, 1, 2...) : si tu supprimes le premier item, Compose recycle mal les vues et l'état visuel est attribué par erreur à l'élément suivant."}, "retenir": ["LazyColumn = recyclage virtuel ultra-performant pour les listes verticales.", "items(liste, key = { it.id }) est la façon canonique d'afficher des données.", "Ne JAMAIS imbriquer une LazyColumn dans un Column avec verticalScroll.", "Utilise `contentPadding = PaddingValues(...)` pour ajouter des marges sans couper le scroll."], "prereq": ["layout", "card"], "suite": ["state", "crud"]}, "state": {"id": "state", "title": "Gestion de l'État & Recomposition (State)", "niveau": 4, "level": "mid", "duration": "15 min", "quoi": "En Jetpack Compose, l'<b>état</b> (State) est une valeur observable qui décrit ce qui doit être affiché à l'écran à un instant T. Dès que cette valeur change, Compose déclenche automatiquement une <b>recomposition</b> : il ré-exécute les fonctions Composable concernées pour rafraîchir l'affichage instantanément.", "pourquoi": "Si tu déclares une simple variable Kotlin (`var compteur = 0`), Compose n'a aucun moyen d'être averti quand elle change, et lors de chaque redessin d'écran, la variable serait réinitialisée à 0 ! `remember` permet de conserver la valeur en mémoire, et `mutableStateOf` en fait un conteneur réactif qui avertit l'écran.", "quand": "Dès qu'une interaction utilisateur modifie un élément : champ texte qui se remplit, case cochée, compteur d'articles, visibilité d'une fenêtre de dialogue ou panier d'achat.", "syntaxe": "// 1. Déclaration avec délégation 'by' (recommandée)\nvar nom by remember { mutableStateOf(\"\") }\n\n// 2. Survie aux rotations d'écran (changement d'orientation)\nvar compteur by rememberSaveable { mutableStateOf(0) }\n\n// 3. State Hoisting (remontée d'état vers le parent)\n@Composable\nfun MonChamp(valeur: String, onValeurChange: (String) -> Unit)", "exempleMin": "@Composable\nfun CompteurSimple() {\n    var count by remember { mutableStateOf(0) }\n\n    Button(onClick = { count++ }) {\n        Text(\"Cliqué $count fois\")\n    }\n}", "explication": [["remember { ... }", "Indique à Compose de mémoriser cette valeur entre les recompositions successives (évite qu'elle retombe à 0)."], ["mutableStateOf(0)", "Crée un objet réactif encapsulant la valeur 0 et écouté par Compose."], ["by", "Opérateur de délégation Kotlin. Il permet de manipuler `count` comme un simple Int sans devoir écrire `count.value`."], ["onClick = { count++ }", "Incrémente l'état. Compose détecte la mutation et recompose immédiatement le Text."]], "exempleReel": "package com.example.app.ui\n\nimport androidx.compose.foundation.layout.*\nimport androidx.compose.foundation.shape.RoundedCornerShape\nimport androidx.compose.material.icons.Icons\nimport androidx.compose.material.icons.filled.Add\nimport androidx.compose.material.icons.filled.Refresh\nimport androidx.compose.material.icons.filled.Remove\nimport androidx.compose.material3.*\nimport androidx.compose.runtime.*\nimport androidx.compose.runtime.saveable.rememberSaveable\nimport androidx.compose.ui.Alignment\nimport androidx.compose.ui.Modifier\nimport androidx.compose.ui.graphics.Color\nimport androidx.compose.ui.text.font.FontWeight\nimport androidx.compose.ui.tooling.preview.Preview\nimport androidx.compose.ui.unit.dp\nimport androidx.compose.ui.unit.sp\n\n/**\n * Exemple de A à Z : Composant interactif de gestion de stock\n * avec rememberSaveable (survie à la rotation), calcul de montant\n * et application du pattern \"State Hoisting\" (remontée d'état).\n */\n@Composable\nfun GestionnaireArticleComplet() {\n    // État conservé même lors d'une rotation d'écran grâce à rememberSaveable\n    var quantite by rememberSaveable { mutableStateOf(1) }\n    val prixUnitaire = 24.90\n\n    Card(\n        modifier = Modifier\n            .fillMaxWidth()\n            .padding(16.dp),\n        shape = RoundedCornerShape(20.dp),\n        colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surfaceVariant)\n    ) {\n        Column(\n            modifier = Modifier.padding(20.dp),\n            horizontalAlignment = Alignment.CenterHorizontally\n        ) {\n            Text(\n                text = \"T-shirt Kotlin Developer\",\n                fontSize = 18.sp,\n                fontWeight = FontWeight.Bold\n            )\n            Text(\n                text = \"Prix unitaire : $prixUnitaire €\",\n                color = Color.Gray,\n                fontSize = 14.sp\n            )\n\n            Spacer(modifier = Modifier.height(20.dp))\n\n            // Composant réutilisable sans état propre (Stateless)\n            SelecteurQuantite(\n                quantite = quantite,\n                surAugmenter = { quantite++ },\n                surDiminuer = { if (quantite > 1) quantite-- },\n                surReinitialiser = { quantite = 1 }\n            )\n\n            Spacer(modifier = Modifier.height(20.dp))\n            Divider()\n            Spacer(modifier = Modifier.height(16.dp))\n\n            // Calcul réactif instantané\n            val total = quantite * prixUnitaire\n            Row(\n                modifier = Modifier.fillMaxWidth(),\n                horizontalArrangement = Arrangement.SpaceBetween,\n                verticalAlignment = Alignment.CenterVertically\n            ) {\n                Text(\"Total commande :\", fontSize = 16.sp, fontWeight = FontWeight.Medium)\n                Text(\n                    text = String.format(\"%.2f €\", total),\n                    fontSize = 22.sp,\n                    fontWeight = FontWeight.ExtraBold,\n                    color = Color(0xFF1E8F72)\n                )\n            }\n        }\n    }\n}\n\n/**\n * State Hoisting : Ce composant ne contient aucun état ('remember').\n * Il reçoit sa valeur et émet des événements (Unidirectional Data Flow).\n * Il est 100% testable et réutilisable dans n'importe quel écran.\n */\n@Composable\nfun SelecteurQuantite(\n    quantite: Int,\n    surAugmenter: () -> Unit,\n    surDiminuer: () -> Unit,\n    surReinitialiser: () -> Unit\n) {\n    Row(\n        verticalAlignment = Alignment.CenterVertically,\n        horizontalArrangement = Arrangement.spacedBy(16.dp)\n    ) {\n        // Bouton Moins\n        FilledIconButton(\n            onClick = surDiminuer,\n            enabled = quantite > 1,\n            colors = IconButtonDefaults.filledIconButtonColors(containerColor = MaterialTheme.colorScheme.primary)\n        ) {\n            Icon(Icons.Default.Remove, contentDescription = \"Diminuer\")\n        }\n\n        // Valeur courante\n        Text(\n            text = \"$quantite\",\n            fontSize = 24.sp,\n            fontWeight = FontWeight.Bold,\n            modifier = Modifier.widthIn(min = 40.dp)\n        )\n\n        // Bouton Plus\n        FilledIconButton(\n            onClick = surAugmenter,\n            colors = IconButtonDefaults.filledIconButtonColors(containerColor = MaterialTheme.colorScheme.primary)\n        ) {\n            Icon(Icons.Default.Add, contentDescription = \"Augmenter\")\n        }\n\n        // Bouton Reset\n        IconButton(onClick = surReinitialiser) {\n            Icon(Icons.Default.Refresh, contentDescription = \"Réinitialiser\", tint = Color.Gray)\n        }\n    }\n}\n\n@Preview(showBackground = true)\n@Composable\nfun GestionnairePreview() {\n    MaterialTheme {\n        GestionnaireArticleComplet()\n    }\n}", "gradle": "// build.gradle.kts (Module :app)\ndependencies {\n    implementation(platform(\"androidx.compose:compose-bom:2024.04.01\"))\n    implementation(\"androidx.compose.runtime:runtime\")\n    implementation(\"androidx.compose.runtime:runtime-saveable\")\n    implementation(\"androidx.compose.material3:material3\")\n}", "resultat": "T-shirt Kotlin Developer\nPrix unitaire : 24.90 €\n\n  [ - ]    3    [ + ]    [ ↺ ]\n\n───────────────────────────────\nTotal commande :       74.70 €", "params": [["remember { mutableStateOf(x) }", "Garde la valeur en mémoire vive durant la recomposition. Réinitialisé en cas de rotation d'écran."], ["rememberSaveable { mutableStateOf(x) }", "Conserve la valeur dans le Bundle de l'Activity : survit aux rotations et à la mise en arrière-plan."], ["by (import runtime.getValue/setValue)", "Délégation permettant d'accéder directement au type sous-jacent (Int, String) sans `.value`."], ["State Hoisting (Remontée d'état)", "Bonne pratique consistant à transformer un composant avec état (Stateful) en composant pur (Stateless) recevant `value` et `onValueChange`."]], "erreurs": [["Le compteur se réinitialise à chaque rotation d'écran", "Tu as utilisé `remember` au lieu de `rememberSaveable`. Seul `rememberSaveable` survit aux changements de configuration (rotation, passage en mode sombre)."], ["Unresolved reference: getValue / setValue", "Les imports d'extension Kotlin manquent dans ton fichier. Ajoute impérativement : `import androidx.compose.runtime.getValue` et `import androidx.compose.runtime.setValue`."], ["Modifier l'état directement dans le corps du Composable sans lambda", "Écrire `compteur++` directement dans le corps d'une fonction Composable provoque une boucle infinie de recompositions et fait geler l'application. Les mutations d'état doivent TOUJOURS se faire dans des callbacks (onClick, onValueChange...)."]], "exercice": {"enonce": "Crée un composant d'interrupteur avec remember : un Switch accompagné d'un texte dynamique qui affiche 'Lumière allumée' (en vert) ou 'Lumière éteinte' (en gris) selon sa valeur.", "indice": "Déclare `var estAllume by remember { mutableStateOf(false) }`, puis Row avec Switch(checked = estAllume, onCheckedChange = { estAllume = it }) et Text.", "solution": "@Composabl
