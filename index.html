e\nfun InterrupteurLumiere() {\n    var estAllume by remember { mutableStateOf(false) }\n\n    Row(\n        modifier = Modifier.padding(16.dp),\n        verticalAlignment = Alignment.CenterVertically,\n        horizontalArrangement = Arrangement.spacedBy(12.dp)\n    ) {\n        Switch(\n            checked = estAllume,\n            onCheckedChange = { estAllume = it }\n        )\n        Text(\n            text = if (estAllume) \"💡 Lumière allumée\" else \"🌙 Lumière éteinte\",\n            fontWeight = FontWeight.Bold,\n            color = if (estAllume) Color(0xFF1E8F72) else Color.Gray,\n            fontSize = 16.sp\n        )\n    }\n}"}, "quiz": {"q": "Quelle est la différence fondamentale entre `remember` et `rememberSaveable` ?", "options": ["remember ne survit pas à la rotation de l'écran du téléphone, alors que rememberSaveable sauvegarde la valeur dans le Bundle de l'Activity", "remember est asynchrone, rememberSaveable est synchrone", "rememberSaveable est réservé aux types String uniquement", "remember est déprécié depuis Compose 1.5"], "correct": 0, "exp": "`remember` conserve l'état uniquement tant que le Composable reste dans l'arbre de composition. Lorsqu'une rotation d'écran survient, l'Activity Android est détruite puis recréée : `remember` est alors réinitialisé, tandis que `rememberSaveable` persiste la valeur grâce au Bundle de sauvegarde d'état."}, "retenir": ["Un changement d'état (State) déclenche automatiquement une recomposition de l'interface.", "Utilise `by remember { mutableStateOf(...) }` pour l'état local d'un Composable.", "Utilise `rememberSaveable` pour que l'état survive aux rotations de smartphone.", "Applique le State Hoisting pour rendre tes composants réutilisables et testables unitairement."], "prereq": ["layout"], "suite": ["viewmodel", "mvvm"]}, "viewmodel": {"id": "viewmodel", "title": "Architecture de l'État avec ViewModel & StateFlow", "niveau": 4, "level": "mid", "duration": "16 min", "quoi": "Un <b>ViewModel</b> est une classe Android dédiée à la détention et la gestion de la logique d'un écran. Il hérite de `androidx.lifecycle.ViewModel`. Sa caractéristique majeure est qu'il **survit au cycle de vie de l'écran** : quand l'utilisateur tourne son téléphone et que l'Activity est détruite et recréée, l'instance du ViewModel reste intacte en mémoire avec toutes ses données.", "pourquoi": "Si tu mets toute ta logique métier (appels réseau, calculs de formulaires, chronomètres) directement dans les fonctions Composable avec `remember`, le code devient illisible, impossible à tester unitairement et s'efface lors d'événements complexes. Le ViewModel sépare clairement « ce qui décide » de « ce qui affiche ».", "quand": "Dès qu'un écran dépasse le stade d'un simple widget visuel : formulaires d'inscription, chargement de listes depuis une base de données ou une API, gestion d'un panier.", "syntaxe": "// 1. Définition du ViewModel\nclass MonViewModel : ViewModel() {\n    // Encapsulation : MutableStateFlow privé, StateFlow public en lecture seule\n    private val _uiState = MutableStateFlow(ValeurInitiale)\n    val uiState: StateFlow<TypeState> = _uiState.asStateFlow()\n\n    fun declencherAction() {\n        viewModelScope.launch {\n            // Travail en coroutine asynchrone sécurisée\n        }\n    }\n}\n\n// 2. Consommation dans Compose\n@Composable\nfun MonEcran(viewModel: MonViewModel = viewModel()) {\n    val state by viewModel.uiState.collectAsStateWithLifecycle()\n}", "exempleMin": "class CompteurViewModel : ViewModel() {\n    var count by mutableStateOf(0)\n        private set\n\n    fun incrementer() { count++ }\n}\n\n@Composable\nfun VueCompteur(vm: CompteurViewModel = viewModel()) {\n    Button(onClick = { vm.incrementer() }) {\n        Text(\"Total : \\${vm.count}\")\n    }\n}", "explication": [["class CompteurViewModel : ViewModel()", "Hérite de la classe officielle AndroidX. Android associe son cycle de vie à l'écran."], ["var count ... private set", "Expose la variable en lecture publique, mais interdit sa modification directe depuis l'UI."], ["fun incrementer()", "Seule porte d'entrée autorisée pour modifier la donnée (centralisation de la logique métier)."], ["viewModel: CompteurViewModel = viewModel()", "Fonction Compose qui injecte ou récupère l'instance unique existante du ViewModel liée à l'écran."]], "exempleReel": "package com.example.app.ui\n\nimport androidx.lifecycle.ViewModel\nimport androidx.lifecycle.viewModelScope\nimport androidx.lifecycle.compose.collectAsStateWithLifecycle\nimport androidx.lifecycle.viewmodel.compose.viewModel\nimport androidx.compose.foundation.layout.*\nimport androidx.compose.material3.*\nimport androidx.compose.runtime.*\nimport androidx.compose.ui.Alignment\nimport androidx.compose.ui.Modifier\nimport androidx.compose.ui.graphics.Color\nimport androidx.compose.ui.text.font.FontWeight\nimport androidx.compose.ui.tooling.preview.Preview\nimport androidx.compose.ui.unit.dp\nimport androidx.compose.ui.unit.sp\nimport kotlinx.coroutines.delay\nimport kotlinx.coroutines.flow.MutableStateFlow\nimport kotlinx.coroutines.flow.StateFlow\nimport kotlinx.coroutines.flow.asStateFlow\nimport kotlinx.coroutines.launch\n\n// 1. Modèle d'état d'écran immuable (State Pattern)\ndata class FormulaireUiState(\n    val email: String = \"\",\n    val motDePasse: String = \"\",\n    val estValide: Boolean = false,\n    val estEnCours: Boolean = false,\n    val messageConfirmation: String? = null\n)\n\n// 2. ViewModel gérant toute la logique métier\nclass AuthentificationViewModel : ViewModel() {\n\n    private val _uiState = MutableStateFlow(FormulaireUiState())\n    val uiState: StateFlow<FormulaireUiState> = _uiState.asStateFlow()\n\n    fun onEmailChange(nouveau: String) {\n        val valide = nouveau.contains(\"@\") && _uiState.value.motDePasse.length >= 6\n        _uiState.value = _uiState.value.copy(email = nouveau, estValide = valide)\n    }\n\n    fun onMotDePasseChange(nouveau: String) {\n        val valide = _uiState.value.email.contains(\"@\") && nouveau.length >= 6\n        _uiState.value = _uiState.value.copy(motDePasse = nouveau, estValide = valide)\n    }\n\n    fun soumettre() {\n        if (!_uiState.value.estValide) return\n\n        viewModelScope.launch {\n            _uiState.value = _uiState.value.copy(estEnCours = true, messageConfirmation = null)\n            // Simulation d'une requête réseau sécurisée\n            delay(1500)\n            _uiState.value = _uiState.value.copy(\n                estEnCours = false,\n                messageConfirmation = \"Bienvenue, \\${_uiState.value.email} ! Connexion réussie.\"\n            )\n        }\n    }\n}\n\n// 3. UI pure (Compose) qui observe l'état et relaie les clics\n@Composable\nfun EcranConnexion(\n    viewModel: AuthentificationViewModel = viewModel()\n) {\n    val state by viewModel.uiState.collectAsStateWithLifecycle()\n\n    Column(\n        modifier = Modifier\n            .fillMaxSize()\n            .padding(24.dp),\n        horizontalAlignment = Alignment.CenterHorizontally,\n        verticalArrangement = Arrangement.Center\n    ) {\n        Text(\n            text = \"Connexion Sécurisée\",\n            fontSize = 24.sp,\n            fontWeight = FontWeight.Bold,\n            color = MaterialTheme.colorScheme.primary\n        )\n\n        Spacer(modifier = Modifier.height(24.dp))\n\n        // Champ Email\n        OutlinedTextField(\n            value = state.email,\n            onValueChange = { viewModel.onEmailChange(it) },\n            label = { Text(\"Adresse Email\") },\n            singleLine = true,\n            modifier = Modifier.fillMaxWidth()\n        )\n\n        Spacer(modifier = Modifier.height(12.dp))\n\n        // Champ Mot de passe\n        OutlinedTextField(\n            value = state.motDePasse,\n            onValueChange = { viewModel.onMotDePasseChange(it) },\n            label = { Text(\"Mot de passe (min 6 car.)\") },\n            singleLine = true,\n            modifier = Modifier.fillMaxWidth()\n        )\n\n        Spacer(modifier = Modifier.height(20.dp))\n\n        // Bouton avec indicateur de chargement\n        Button(\n            onClick = { viewModel.soumettre() },\n            enabled = state.estValide && !state.estEnCours,\n            modifier = Modifier.fillMaxWidth().height(50.dp)\n        ) {\n            if (state.estEnCours) {\n                CircularProgressIndicator(color = Color.White, modifier = Modifier.size(24.dp))\n            } else {\n                Text(\"Se connecter\")\n            }\n        }\n\n        // Message de retour\n        state.messageConfirmation?.let { message ->\n            Spacer(modifier = Modifier.height(20.dp))\n            Surface(\n                color = Color(0xFFE3F5EF),\n                shape = MaterialTheme.shapes.medium\n            ) {\n                Text(\n                    text = message,\n                    color = Color(0xFF1E8F72),\n                    fontWeight = FontWeight.Medium,\n                    modifier = Modifier.padding(12.dp)\n                )\n            }\n        }\n    }\n}", "gradle": "// build.gradle.kts (Module :app)\ndependencies {\n    implementation(\"androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0\")\n    implementation(\"androidx.lifecycle:lifecycle-runtime-compose:2.7.0\")\n    implementation(\"org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0\")\n}", "resultat": "Écran Compose\n   │  (Saisie utilisateur / Clic)\n   ↓  appelle viewModel.onEmailChange(...)\nViewModel (Survit aux rotations !)\n   │  Met à jour _uiState.value\n   ↓  émet via StateFlow\nUI Compose se recompose automatiquement ✓", "params": [["viewModelScope", "Portée de Coroutine liée au cycle de vie du ViewModel. S'annule automatiquement quand l'écran est définitivement fermé."], ["MutableStateFlow / StateFlow", "Conteneur de données réactif moderne recommandé par Google pour exposer l'état vers Compose."], ["collectAsStateWithLifecycle()", "Collecte le Flow de manière sûre : arrête la collecte quand l'app passe en arrière-plan pour économiser la batterie."], ["asStateFlow()", "Convertit un MutableStateFlow privé en StateFlow public en lecture seule (encapsulation)."]], "erreurs": [["Passer un Context d'Activity ou une vue Compose dans le ViewModel", "C'est la pire fuite de mémoire (Memory Leak) possible sous Android ! Le ViewModel vivant plus longtemps que l'Activity, conserver une référence vers l'Activity empêche le ramasse-miettes (GC) de libérer l'écran lors d'une rotation."], ["Modifier l'état public directement depuis l'UI", "L'état exposé doit TOUJOURS être immuable (`StateFlow` ou `private set`). Seules des fonctions explicites du ViewModel doivent modifier les valeurs."]], "exercice": {"enonce": "Crée un ChronoViewModel avec une variable 'secondes' (Int) et une fonction demarrer() qui incrémente les secondes chaque seconde dans une coroutine viewModelScope.", "indice": "Dans demarrer(), lance viewModelScope.launch { while(true) { delay(1000); _secondes.value++ } }", "solution": "class ChronoViewModel : ViewModel() {\n    private val _secondes = MutableStateFlow(0)\n    val secondes: StateFlow<Int> = _secondes.asStateFlow()\n\n    private var estEnCours = false\n\n    fun demarrer() {\n        if (estEnCours) return\n        estEnCours = true\n        viewModelScope.launch {\n            while (estEnCours) {\n                delay(1000)\n                _secondes.value++\n            }\n        }\n    }\n\n    fun reinitialiser() {\n        estEnCours = false\n        _secondes.value = 0\n    }\n}"}, "quiz": {"q": "Que devient une instance de ViewModel lorsque l'utilisateur effectue une rotation de son smartphone ?", "options": ["L'instance reste vivante et est automatiquement rattachée au nouvel écran sans perte de données", "Elle est détruite et recréée comme l'Activity", "Elle génère une exception OutOfMemoryError", "Elle est sauvegardée dans le stockage local du téléphone"], "correct": 0, "exp": "Le composant ViewModel d'AndroidX a été conçu spécifiquement pour survivre aux changements de configuration (comme la rotation portrait/paysage). L'Activity est détruite et reconstruite, mais le système Android conserve le ViewModel en mémoire et le reconnecte instantanément au nouvel écran."}, "retenir": ["Le ViewModel héberge l'état et la logique métier de l'écran.", "Il survit à la rotation d'écran, contrairement à remember.", "Ne JAMAIS passer de référence vers une Activity ou un Context UI dans un ViewModel.", "Utilise StateFlow + collectAsStateWithLifecycle() pour une observation réactive sans fuite mémoire."], "prereq": ["state"], "suite": ["mvvm", "room"]}, "mvvm": {"id": "mvvm", "title": "L'Architecture MVVM & Unidirectional Data Flow", "niveau": 5, "level": "mid", "duration": "15 min", "quoi": "L'architecture <b>MVVM</b> (Model-View-ViewModel) est la norme recommandée par Google pour concevoir des applications Android professionnelles, évolutives et maintenables. Elle organise le code en trois couches indépendantes : la <b>View</b> (interface Jetpack Compose), le <b>ViewModel</b> (logique d'écran) et le <b>Model / Repository</b> (sources de données locales et distantes).", "pourquoi": "Sans architecture, on a tendance à mettre les appels API, le stockage en base et la logique de calcul au milieu de l'interface graphique Compose. Le code devient un plat de spaghettis illisible, impossible à tester et qui plante dès que le réseau ralentit. MVVM garantit le principe de responsabilité unique (SRP).", "quand": "Sur la totalité de vos projets d'applications Android. C'est l'architecture standard du cours et des entreprises.", "syntaxe": "// Flux Unidirectionnel des Données (UDF)\n// [ UI ] ──(Events : clics)──▶ [ ViewModel ] ──(Requête)──▶ [ Repository ]\n// [ UI ] ◀──(UiState : données)── [ ViewModel ] ◀──(Données)── [ Repository ]\n\n// 1. Modèle d'état scellé (Sealed Interface)\nsealed interface ProduitsUiState {\n    object Chargement : ProduitsUiState\n    data class Succes(val produits: List<Produit>) : ProduitsUiState\n    data class Erreur(val message: String) : ProduitsUiState\n}", "exempleMin": "// UI observe le ViewModel, ViewModel appelle le Repository\nclass ProduitsViewModel(private val repository: ProduitRepository) : ViewModel() {\n    val uiState = repository.getProduits().stateIn(\n        viewModelScope, SharingStarted.WhileSubscribed(5000), emptyList()\n    )\n}", "explication": [["sealed interface ProduitsUiState", "Permet de modéliser avec une sécurité absolue les 3 états possibles d'un écran : En cours de chargement, Succès avec données, ou Échec avec message."], ["Repository", "Point de vérité unique : décide en toute transparence s'il va chercher la donnée dans la base Room ou sur l'API web."], ["ViewModel", "Intermédiaire : reçoit les clics de la View, appelle le Repository et met à jour l'UiState."], ["View (Compose)", "Couche bête : ne contient aucune logique, ne fait que dessiner l'UiState via un `when (uiState)`."]], "exempleReel": "package com.example.app.architecture\n\nimport androidx.lifecycle.ViewModel\nimport androidx.lifecycle.viewModelScope\nimport androidx.lifecycle.compose.collectAsStateWithLifecycle\nimport androidx.compose.foundation.layout.*\nimport androidx.compose.foundation.lazy.LazyColumn\nimport androidx.compose.foundation.lazy.items\nimport androidx.compose.material3.*\nimport androidx.compose.runtime.*\nimport androidx.compose.ui.Alignment\nimport androidx.compose.ui.Modifier\nimport androidx.compose.ui.graphics.Color\nimport androidx.compose.ui.text.font.FontWeight\nimport androidx.compose.ui.tooling.preview.Preview\nimport androidx.compose.ui.unit.dp\nimport kotlinx.coroutines.delay\nimport kotlinx.coroutines.flow.MutableStateFlow\nimport kotlinx.coroutines.flow.StateFlow\nimport kotlinx.coroutines.flow.asStateFlow\nimport kotlinx.coroutines.launch\n\n// ══════════════════════════════════════════\n// COUCHE 1 : MODEL & REPOSITORY (Données)\n// ══════════════════════════════════════════\ndata class Article(val id: Int, val titre: String, val categorie: String)\n\nclass ArticleRepository {\n    suspend fun chargerArticles(): List<Article> {\n        delay(1200) // Simulation d'une latence réseau\n        return listOf(\n            Article(1, \"Introduction à Jetpack Compose\", \"Mobile\"),\n            Article(2, \"Architecture MVVM & Clean Architecture\", \"Architecture\"),\n            Article(3, \"Room et SQLite en Kotlin\", \"Persistance\"),\n            Article(4, \"Consommer une API REST avec Retrofit\", \"Réseau\")\n        )\n    }\n}\n\n// ══════════════════════════════════════════\n// COUCHE 2 : VIEWMODEL & UISTATE (Logique)\n// ══════════════════════════════════════════\nsealed interface ArticlesUiState {\n    object Chargement : ArticlesUiState\n    data class Succes(val articles: List<Article>) : ArticlesUiState\n    data class Erreur(val erreur: String) : ArticlesUiState\n}\n\nclass ArticlesViewModel(\n    private val repository: ArticleRepository = ArticleRepository()\n) : ViewModel() {\n\n    private val _uiState = MutableStateFlow<ArticlesUiState>(ArticlesUiState.Chargement)\n    val uiState: StateFlow<ArticlesUiState> = _uiState.asStateFlow()\n\n    init {\n        rafraichir()\n    }\n\n    fun rafraichir() {\n        viewModelScope.launch {\n            _uiState.value = ArticlesUiState.Chargement\n            try {\n                val donnees = repository.chargerArticles()\n                _uiState.value = ArticlesUiState.Succes(donnees)\n            } catch (e: Exception) {\n                _uiState.value = ArticlesUiState.Erreur(\"Impossible de charger les articles : \\${e.localizedMessage}\")\n            }\n        }\n    }\n}\n\n// ══════════════════════════════════════════\n// COUCHE 3 : VIEW COMPOSE (Affichage Pur)\n// ══════════════════════════════════════════\n@Composable\nfun EcranArticlesMVVM(viewModel: ArticlesViewModel = ArticlesViewModel()) {\n    val state by viewModel.uiState.collectAsStateWithLifecycle()\n\n    Scaffold(\n        topBar = {\n            Surface(shadowElevation = 4.dp) {\n                Text(\n                    text = \"Centre de Documentation\",\n                    style = MaterialTheme.typography.titleLarge,\n                    fontWeight = FontWeight.Bold,\n                    modifier = Modifier.padding(16.dp)\n                )\n            }\n        }\n    ) { padding ->\n        Box(\n            modifier = Modifier\n                .fillMaxSize()\n                .padding(padding),\n            contentAlignment = Alignment.Center\n        ) {\n            when (val currentState = state) {\n                is ArticlesUiState.Chargement -> {\n                    Column(horizontalAlignment = Alignment.CenterHorizontally) {\n                        CircularProgressIndicator(color = Color(0xFF7F52FF))\n                        Spacer(modifier = Modifier.height(12.dp))\n                        Text(\"Chargement des articles...\", color = Color.Gray)\n                    }\n                }\n                is ArticlesUiState.Erreur -> {\n                    Column(horizontalAlignment = Alignment.CenterHorizontally, modifier = Modifier.padding(16.dp)) {\n                        Text(text = \"❌ \\${currentState.erreur}\", color = MaterialTheme.colorScheme.error)\n                        Spacer(modifier = Modifier.height(12.dp))\n                        Button(onClick = { viewModel.rafraichir() }) {\n                            Text(\"Réessayer\")\n                        }\n                    }\n                }\n                is ArticlesUiState.Succes -> {\n                    LazyColumn(\n                        modifier = Modifier.fillMaxSize(),\n                        contentPadding = PaddingValues(16.dp),\n                        verticalArrangement = Arrangement.spacedBy(8.dp)\n                    ) {\n                        items(currentState.articles, key = { it.id }) { article ->\n                            Card(modifier = Modifier.fillMaxWidth()) {\n                                Column(modifier = Modifier.padding(16.dp)) {\n                                    Text(article.titre, fontWeight = FontWeight.SemiBold)\n                                    Text(article.categorie, color = Color(0xFF7F52FF), style = MaterialTheme.typography.bodySmall)\n                                }\n                            }\n                        }\n                    }\n                }\n            }\n        }\n    }\n}", "gradle": "// build.gradle.kts (Module :app)\ndependencies {\n    implementation(\"androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0\")\n    implementation(\"androidx.lifecycle:lifecycle-runtime-compose:2.7.0\")\n    implementation(\"org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0\")\n}", "resultat": "┌─────────────────────────────────────────────────────┐\n│                      VIEW (Compose)                 │\n│         Dessine l'UiState (Chargement / Succès)     │\n└──────────────────────────┬──────────────────────────┘\n                           │ envoie les clics (Events)\n                           ▼\n┌─────────────────────────────────────────────────────┐\n│                    VIEWMODEL                        │\n│          Garde l'UiState, lance les coroutines      │\n└──────────────────────────┬──────────────────────────┘\n                           │ demande les données\n                           ▼\n┌─────────────────────────────────────────────────────┐\n│                    REPOSITORY                       │\n│    Choisit entre l'API REST (Retrofit) et Room      │\n└─────────────────────────────────────────────────────┘", "params": [["Unidirectional Data Flow (UDF)", "Règle absolue : Les données descendent (State down) du ViewModel vers l'UI, et les événements montent (Events up) de l'UI vers le ViewModel."], ["sealed interface UiState", "Empêche tout état incohérent (impossible d'avoir à la fois 'chargement en cours' et 'données affichées')."], ["Repository", "Point de vérité unique (Single Source of Truth) masquant la complexité des requêtes SQL et HTTP."], ["Separation of Concerns (SoC)", "Chaque classe ne possède qu'une responsabilité précise."]], "erreurs": [["L'UI appelle directement une requête Room ou Retrofit", "C'est une violation grave de l'architecture. La vue Compose ne doit JAMAIS savoir d'où proviennent les données. Elle doit uniquement s'adresser à son ViewModel."], ["Créer des variables multiples sans sealed interface (ex: var loading, var data, var error)", "Ce patron crée des bugs d'états incohérents (par exemple si loading=true ET error!=null en même temps). Utilise TOUJOURS une `sealed interface UiState` pour modéliser des états mutuellement exclusifs."]], "exercice": {"enonce": "Dans l'architecture ci-dessus, ajoute un état 'Vide' (object Vide : ArticlesUiState) déclenché lorsque la liste renvoyée par le Repository ne contient aucun élément, et affiche un texte 'Aucun article disponible pour le moment'.", "indice": "Dans ArticlesViewModel : if (donnees.isEmpty()) ArticlesUiState.Vide else ArticlesUiState.Succes(donnees). Puis gère 'is ArticlesUiState.Vide' dans le when Compose.", "solution": "// Dans la sealed interface :\nsealed interface ArticlesUiState {\n    object Chargement : ArticlesUiState\n    object Vide : ArticlesUiState\n    data class Succes(val articles: List<Article>) : ArticlesUiState\n    data class Erreur(val erreur: String) : ArticlesUiState\n}\n\n// Dans le when de la vue Compose :\nis ArticlesUiState.Vide -> {\n    Column(horizontalAlignment = Alignment.CenterHorizontally) {\n        Text(\"📭 Aucun article disponible pour le moment.\", color = Color.Gray)\n        Spacer(modifier = Modifier.height(12.dp))\n        OutlinedButton(onClick = { viewModel.rafraichir() }) { Text(\"Actualiser\") }\n    }\n}"}, "quiz": {"q": "Dans l'architecture MVVM préconisée par Google, quelle couche a la responsabilité d'arbitrer entre les données en cache local (Room) et le serveur distant (API Retrofit) ?", "options": ["Le Repository", "Le Composable de l'écran", "Le ViewModel", "L'Activity principale"], "correct": 0, "exp": "Le Repository a pour rôle d'agir comme source unique de vérité. C'est lui qui sait s'il doit interroger la base locale SQLite ou l'API réseau, et synchroniser les deux. Le ViewModel se contente de demander les données au Repository sans se soucier de leur provenance."}, "retenir": ["MVVM sépare en 3 couches : View (affichage Compose), ViewModel (logique d'écran), Repository (données).", "L'UDF (Unidirectional Data Flow) : l'état descend, les événements remontent.", "Utilise toujours une `sealed interface UiState` (Chargement, Succès, Erreur).", "L'UI n'a jamais accès direct à la base de données ou à Internet."], "prereq": ["viewmodel", "state"], "suite": ["datastore", "room", "api"]}, "datastore": {"id": "datastore", "title": "Sauvegarder des Préférences avec DataStore", "niveau": 6, "level": "mid", "duration": "15 min", "quoi": "<b>Jetpack DataStore</b> est la solution moderne de stockage de données légères développée par Google pour remplacer définitivement l'ancienne bibliothèque `SharedPreferences`. Construit nativement sur les **Coroutines Kotlin** et les **Flows**, DataStore garantit une écriture asynchrone non-bloquante et une cohérence transactionnelle absolue.", "pourquoi": "SharedPreferences présentait deux défauts majeurs : il bloquait le thread principal lors des sauvegardes (provoquant des gels d'écran ANR - Application Not Responding) et n'offrait aucun moyen propre d'écouter les modifications de manière réactive. DataStore résout ces problèmes en exposant un `Flow` réactif et une méthode d'écriture `edit { }` suspendue.", "quand": "Pour toutes les préférences utilisateur simples : activer le mode sombre, mémoriser la langue préférée, retenir l'identifiant de session ou savoir si l'utilisateur a déjà vu le tutoriel d'accueil.", "syntaxe": "// 1. Déclaration unique du délégué\nval Context.dataStore: DataStore<Preferences> by preferencesDataStore(name = \"user_preferences\")\n\n// 2. Définition d'une clé typée\nval CLE_MODE_SOMBRE = booleanPreferencesKey(\"mode_sombre\")\n\n// 3. Écriture suspendue (Coroutine)\nsuspend fun sauvegarder(valeur: Boolean) {\n    context.dataStore.edit { preferences ->\n        preferences[CLE_MODE_SOMBRE] = valeur\n    }\n}\n\n// 4. Lecture réactive continue (Flow)\nval modeSombreFlow: Flow<Boolean> = context.dataStore.data\n    .map { preferences -> preferences[CLE_MODE_SOMBRE] ?: false }", "exempleMin": "// Écriture\nsuspend fun sauverPseudo(context: Context, pseudo: String) {\n    context.dataStore.edit { it[stringPreferencesKey(\"pseudo\")] = pseudo }\n}\n\n// Lecture\nfun lirePseudo(context: Context): Flow<String> =\n    context.dataStore.data.map { it[stringPreferencesKey(\"pseudo\")] ?: \"Invité\" }", "explication": [["preferencesDataStore(name = \"user_preferences\")", "Crée un fichier sur le stockage privé de l'appareil nommé 'user_preferences.preferences_pb'."], ["booleanPreferencesKey(\"mode_sombre\")", "Définit une clé typée assurant qu'on ne pourra y stocker qu'un Boolean (évite les erreurs de typage)."], ["context.dataStore.edit { ... }", "Fonction `suspend` exécutant l'écriture de manière atomique sur un thread d'arrière-plan."], ["context.dataStore.data.map { ... }", "Transforme le flux de préférences en flux d'une valeur précise, mis à jour en temps réel."]], "exempleReel": "package com.example.app.preferences\n\nimport android.content.Context\nimport androidx.datastore.core.DataStore\nimport androidx.datastore.preferences.core.*\nimport androidx.datastore.preferences.preferencesDataStore\nimport androidx.lifecycle.ViewModel\nimport androidx.lifecycle.viewModelScope\nimport androidx.lifecycle.compose.collectAsStateWithLifecycle\nimport androidx.lifecycle.viewmodel.compose.viewModel\nimport androidx.compose.foundation.layout.*\nimport androidx.compose.material3.*\nimport androidx.compose.runtime.*\nimport androidx.compose.ui.Alignment\nimport androidx.compose.ui.Modifier\nimport androidx.compose.ui.platform.LocalContext\nimport androidx.compose.ui.text.font.FontWeight\nimport androidx.compose.ui.tooling.preview.Preview\nimport androidx.compose.ui.unit.dp\nimport androidx.compose.ui.unit.sp\nimport kotlinx.coroutines.flow.Flow\nimport kotlinx.coroutines.flow.SharingStarted\nimport kotlinx.coroutines.flow.StateFlow\nimport kotlinx.coroutines.flow.catch\nimport kotlinx.coroutines.flow.map\nimport kotlinx.coroutines.flow.stateIn\nimport kotlinx.coroutines.launch\nimport java.io.IOException\n\n// 1. Extension contextuelle singleton (obligatoirement au niveau supérieur du fichier)\nval Context.parametresDataStore: DataStore<Preferences> by preferencesDataStore(name = \"parametres_app\")\n\n// 2. Modèle de préférences\ndata class ParametresUtilisateur(\n    val modeSombre: Boolean,\n    val notificationsActives: Boolean,\n    val nomUtilisateur: String\n)\n\n// 3. Repository encapsulant DataStore\nclass ParametresRepository(private val context: Context) {\n\n    private object Cles {\n        val MODE_SOMBRE = booleanPreferencesKey(\"cle_mode_sombre\")\n        val NOTIFS = booleanPreferencesKey(\"cle_notifs\")\n        val PSEUDO = stringPreferencesKey(\"cle_pseudo\")\n    }\n\n    // Lecture réactive sécurisée\n    val parametresFlow: Flow<ParametresUtilisateur> = context.parametresDataStore.data\n        .catch { exception ->\n            if (exception is IOException) emit(emptyPreferences()) else throw exception\n        }\n        .map { prefs ->\n            ParametresUtilisateur(\n                modeSombre = prefs[Cles.MODE_SOMBRE] ?: false,\n                notificationsActives = prefs[Cles.NOTIFS] ?: true,\n                nomUtilisateur = prefs[Cles.PSEUDO] ?: \"Développeur\"\n            )\n        }\n\n    suspend fun definirModeSombre(actif: Boolean) {\n        context.parametresDataStore.edit { it[Cles.MODE_SOMBRE] = actif }\n    }\n\n    suspend fun definirNotifications(actives: Boolean) {\n        context.parametresDataStore.edit { it[Cles.NOTIFS] = actives }\n    }\n\n    suspend fun definirNom(nom: String) {\n        context.parametresDataStore.edit { it[Cles.PSEUDO] = nom }\n    }\n}\n\n// 4. ViewModel reliant Repository et UI\nclass ParametresViewModel(private val repository: ParametresRepository) : ViewModel() {\n\n    val uiState: StateFlow<ParametresUtilisateur> = repository.parametresFlow\n        .stateIn(\n            scope = viewModelScope,\n            started = SharingStarted.WhileSubscribed(5000),\n            initialValue = ParametresUtilisateur(false, true, \"Chargement...\")\n        )\n\n    fun changerModeSombre(actif: Boolean) = viewModelScope.launch { repository.definirModeSombre(actif) }\n    fun changerNotifications(actives: Boolean) = viewModelScope.launch { repository.definirNotifications(actives) }\n    fun changerNom(nom: String) = viewModelScope.launch { repository.definirNom(nom) }\n}\n\n// 5. Écran de configuration Compose\n@Composable\nfun EcranParametres(\n    context: Context = LocalContext.current,\n    viewModel: ParametresViewModel = remember { ParametresViewModel(ParametresRepository(context)) }\n) {\n    val params by viewModel.uiState.collectAsStateWithLifecycle()\n\n    Column(\n        modifier = Modifier\n            .fillMaxSize()\n            .padding(20.dp),\n        verticalArrangement = Arrangement.spacedBy(16.dp)\n    ) {\n        Text(\"Préférences de l'App\", fontSize = 22.sp, fontWeight = FontWeight.Bold)\n\n        Card(modifier = Modifier.fillMaxWidth()) {\n            Column(modifier = Modifier.padding(16.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {\n                // Option 1 : Mode Sombre\n                Row(\n                    modifier = Modifier.fillMaxWidth(),\n                    horizontalArrangement = Arrangement.SpaceBetween,\n                    verticalAlignment = Alignment.CenterVertically\n                ) {\n                    Column {\n                        Text(\"Mode Sombre\", fontWeight = FontWeight.SemiBold)\n                        Text(\"Activer le thème nuit\", style = MaterialTheme.typography.bodySmall)\n                    }\n                    Switch(\n                        checked = params.modeSombre,\n                        onCheckedChange = { viewModel.changerModeSombre(it) }\n                    )\n                }\n\n                Divider()\n\n                // Option 2 : Notifications\n                Row(\n                    modifier = Modifier.fillMaxWidth(),\n                    horizontalArrangement = Arrangement.SpaceBetween,\n                    verticalAlignment = Alignment.CenterVertically\n                ) {\n                    Column {\n                        Text(\"Notifications\", fontWeight = FontWeight.SemiBold)\n                        Text(\"Recevoir les alertes de cours\", style = MaterialTheme.typography.bodySmall)\n                    }\n                    Switch(\n                        checked = params.notificationsActives,\n                        onCheckedChange = { viewModel.changerNotifications(it) }\n                    )\n                }\n\n                Divider()\n\n                // Option 3 : Pseudo\n                OutlinedTextField(\n                    value = params.nomUtilisateur,\n                    onValueChange = { viewModel.changerNom(it) },\n                    label = { Text(\"Nom d'utilisateur\") },\n                    modifier = Modifier.fillMaxWidth()\n                )\n            }\n        }\n    }\n}", "gradle": "// build.gradle.kts (Module :app)\ndependencies {\n    implementation(\"androidx.datastore:datastore-preferences:1.0.0\")\n    implementation(\"androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0\")\n    implementation(\"androidx.lifecycle:lifecycle-runtime-compose:2.7.0\")\n}", "resultat": "Écran Paramètres (Compose)\n      ↓ (Clic utilisateur sur Switch)\nViewModel.changerModeSombre(true)\n      ↓ (Lance coroutine viewModelScope)\nParametresRepository.definirModeSombre(true)\n      ↓ (context.dataStore.edit { ... })\nFichier Disque 'parametres_app.preferences_pb' mis à jour !\n      ↓ (Le Flow émet la nouvelle valeur)\nUI recomposée instantanément : [ ☑ Mode Sombre ]\n      ✓ Reste conservé après extinction et réouverture de l'app !", "params": [["preferencesDataStore(name = ...)", "Délégué créant une instance singleton du DataStore liée au Context de l'application."], ["booleanPreferencesKey / stringPreferencesKey / intPreferencesKey", "Clés typées évitant les erreurs de casting."], ["dataStore.edit { preferences -> ... }", "Méthode d'écriture atomique et asynchrone (suspend function)."], ["dataStore.data", "Flux (Flow<Preferences>) émettant les valeurs enregistrées à chaque changement."]], "erreurs": [["Crash : IllegalStateException: There are multiple DataStores active for the same file", "Cette erreur classique survient si tu appelles `preferencesDataStore(...)` à l'intérieur d'une classe ou d'une fonction ré-instanciée. Le délégué DOIT être déclaré en top-level (en dehors de toute classe) comme extension : `val Context.dataStore by preferencesDataStore(...)`."], ["La valeur n'est pas enregistrée sur le disque", "L'appel `dataStore.edit { }` est une fonction suspendue : si elle n'est pas lancée dans une Coroutine active (ex: `viewModelScope.launch { ... }`), l'opération est abandonnée."]], "exercice": {"enonce": "Ajoute une clé `intPreferencesKey('compteur_lancements')` pour mémoriser et incrémenter le nombre de fois où l'utilisateur a ouvert l'application.", "indice": "Déclare la clé, puis crée `suspend fun incrementerLancements() { dataStore.edit { it[CLE_LANCEMENTS] = (it[CLE_LANCEMENTS] ?: 0) + 1 } }`.", "solution": "val CLE_LANCEMENTS = intPreferencesKey(\"compteur_lancements\")\n\nsuspend fun incrementerLancements(context: Context) {\n    context.parametresDataStore.edit { prefs ->\n        val actuel = prefs[CLE_LANCEMENTS] ?: 0\n        prefs[CLE_LANCEMENTS] = actuel + 1\n    }\n}\n\nfun observerLancements(context: Context): Flow<Int> =\n    context.parametresDataStore.data.map { it[CLE_LANCEMENTS] ?: 0 }"}, "quiz": {"q": "Pourquoi Jetpack DataStore est-il très supérieur à l'ancienne solution SharedPreferences ?", "options": ["Il s'exécute de manière asynchrone sans jamais bloquer le thread UI et expose un Flow réactif", "Il permet de remplacer complètement une base de données SQL comme Room", "Il est capable de stocker des fichiers vidéo de plusieurs giga-octets", "Il ne nécessite aucune permission Android"], "correct": 0, "exp": "SharedPreferences effectuait ses lectures/écritures de façon synchrone en bloquant le thread graphique principal (ce qui provoquait des saccades et des plantages ANR). DataStore est entièrement asynchrone grâce aux coroutines Kotlin et transmet les mises à jour en direct via l'API Flow."}, "retenir": ["DataStore remplace SharedPreferences pour les préférences clé-valeur.", "Déclare le délégué au niveau supérieur du fichier (`val Context.dataStore by...`).", "L'écriture se fait avec `dataStore.edit { }` dans une coroutine.", "La lecture s'effectue via un `Flow` réactif encapsulé dans un Repository."], "prereq": ["mvvm", "viewmodel"], "suite": ["room", "crud"]}, "room": {"id": "room", "title": "Base de Données Locale SQLite avec Room", "niveau": 6, "level": "adv", "duration": "20 min", "quoi": "<b>Room</b> est la bibliothèque officielle de persistance d'Android fournissant une couche d'abstraction puissante au-dessus de SQLite. Elle repose sur 3 piliers : les <b>Entity</b> (représentent les tables SQL sous forme de data classes Kotlin), les <b>DAO</b> (Data Access Object, interfaces déclarant les requêtes SQL), et la <b>Database</b> (la classe maîtresse gérant l'ouverture et les migrations du fichier de base de données).", "pourquoi": "DataStore est parfait pour de petites préférences, mais incapable de gérer des données structurées et relationnelles (tri, filtrage par date ou prix, jointures). Écrire du code SQLite brut en Android classique provoquait d'innombrables bugs découverts uniquement à l'exécution. Room **vérifie la syntaxe de vos requêtes SQL à la compilation** : si vous tapez une faute dans le nom d'une colonne, le projet refuse de compiler !", "quand": "Dès que l'application doit fonctionner hors-connexion (Offline-First) avec des listes d'éléments structurés : catalogue de produits, tâches, messages de chat, articles favoris, historique.", "syntaxe": "// 1. Entité (Table SQL)\n@Entity(tableName = \"produits\")\ndata class ProduitEntity(\n    @PrimaryKey(autoGenerate = true) val id: Long = 0,\n    val nom: String,\n    val prix: Double\n)\n\n// 2. DAO (Data Access Object)\n@Dao\ninterface ProduitDao {\n    @Query(\"SELECT * FROM produits ORDER BY nom ASC\")\n    fun observerTousLesProduits(): Flow<List<ProduitEntity>>\n\n    @Insert(onConflict = OnConflictStrategy.REPLACE)\n    suspend fun inserer(produit: ProduitEntity): Long\n\n    @Delete\n    suspend fun supprimer(produit: ProduitEntity)\n}\n\n// 3. Database\n@Database(entities = [ProduitEntity::class], version = 1, exportSchema = false)\nabstract class AppDatabase : RoomDatabase() {\n    abstract fun produitDao(): ProduitDao\n}", "exempleMin": "@Entity\ndata class Tache(@PrimaryKey(autoGenerate = true) val id: Int = 0, val titre: String)\n\n@Dao\ninterface TacheDao {\n    @Query(\"SELECT * FROM Tache\")\n    fun getAll(): Flow<List<Tache>>\n\n    @Insert\n    suspend fun insert(tache: Tache)\n}", "explication": [["@Entity(tableName = \"produits\")", "Marque la classe Kotlin comme schéma de table SQLite relationnelle."], ["@PrimaryKey(autoGenerate = true)", "Définit la clé primaire avec auto-incrémentation automatique par SQLite."], ["@Dao", "Interface déclarant les requêtes. Room génère tout le code d'implémentation Java/Kotlin sous le capot via KSP."], ["fun ...: Flow<List<Produit>>", "MAGIE RECOMPOSE : Room surveille la table en temps réel. Dès qu'un produit est ajouté ou supprimé, ce Flow émet instantanément la nouvelle liste vers l'écran !"], ["suspend fun inserer(...)", "Les écritures doivent impérativement être `suspend` pour s'exécuter hors du thread UI."]], "exempleReel": "package com.example.app.data\n\nimport android.content.Context\nimport androidx.room.*\nimport kotlinx.coroutines.flow.Flow\n\n// ══════════════════════════════════════════\n// 1. ENTITÉ : Table 'articles'\n// ══════════════════════════════════════════\n@Entity(tableName = \"articles\")\ndata class ArticleEntity(\n    @PrimaryKey(autoGenerate = true)\n    val id: Long = 0,\n    val titre: String,\n    val quantite: Int,\n    val estAchete: Boolean = false\n)\n\n// ══════════════════════════════════════════\n// 2. DAO : Requêtes SQL typées\n// ══════════════════════════════════════════\n@Dao\ninterface ArticleDao {\n\n    @Query(\"SELECT * FROM articles ORDER BY estAchete ASC, id DESC\")\n    fun observerArticles(): Flow<List<ArticleEntity>>\n\n    @Query(\"SELECT * FROM articles WHERE id = :id\")\n    suspend fun getArticleParId(id: Long): ArticleEntity?\n\n    @Insert(onConflict = OnConflictStrategy.REPLACE)\n    suspend fun insererArticle(article: ArticleEntity): Long\n\n    @Update\n    suspend fun modifierArticle(article: ArticleEntity)\n\n    @Delete\n    suspend fun supprimerArticle(article: ArticleEntity)\n\n    @Query(\"DELETE FROM articles WHERE estAchete = 1\")\n    suspend fun supprimerArticlesAchetes()\n}\n\n// ══════════════════════════════════════════\n// 3. BASE DE DONNÉES : Singleton Room\n// ══════════════════════════════════════════\n@Database(entities = [ArticleEntity::class], version = 1, exportSchema = false)\nabstract class InventaireDatabase : RoomDatabase() {\n\n    abstract fun articleDao(): ArticleDao\n\n    companion object {\n        @Volatile\n        private var INSTANCE: InventaireDatabase? = null\n\n        fun getDatabase(context: Context): InventaireDatabase {\n            return INSTANCE ?: synchronized(this) {\n                val instance = Room.databaseBuilder(\n                    context.applicationContext,\n                    InventaireDatabase::class.java,\n                    \"inventaire_courses.db\"\n                )\n                .fallbackToDestructiveMigration() // Recrée la base si version incrémentée en dev\n                .build()\n                INSTANCE = instance\n                instance\n            }\n        }\n    }\n}\n\n// ══════════════════════════════════════════\n// 4. REPOSITORY : Couche d'abstraction\n// ══════════════════════════════════════════\nclass InventaireRepository(private val dao: ArticleDao) {\n    val tousLesArticles: Flow<List<ArticleEntity>> = dao.observerArticles()\n\n    suspend fun ajouter(titre: String, quantite: Int) {\n        dao.insererArticle(ArticleEntity(titre = titre, quantite = quantite))\n    }\n\n    suspend fun basculerAchat(article: ArticleEntity) {\n        dao.modifierArticle(article.copy(estAchete = !article.estAchete))\n    }\n\n    suspend fun supprimer(article: ArticleEntity) {\n        dao.supprimerArticle(article)\n    }\n}", "gradle": "// build.gradle.kts (Module :app)\nplugins {\n    id(\"com.google.devtools.ksp\") version \"1.9.23-1.0.20\"\n}\n\ndependencies {\n    val roomVersion = \"2.6.1\"\n    implementation(\"androidx.room:room-runtime:$roomVersion\")\n    implementation(\"androidx.room:room-ktx:$roomVersion\") // Support des Coroutines et Flow\n    ksp(\"androidx.room:room-compiler:$roomVersion\") // Générateur de code KSP\n}", "resultat": "Écran Compose (LazyColumn)\n      ▲ (Recomposition automatique dès qu'une ligne change !)\n      │\nFlow<List<ArticleEntity>> (Room Observer)\n      ▲\nDAO : @Query(\"SELECT * FROM articles\")\n      ▲\nBase de données locale SQLite : 'inventaire_courses.db'\n(Sauvegardé définitivement sur le téléphone, 100% hors-ligne)", "params": [["@Entity(tableName = ...)", "Définit le nom exact de la table dans SQLite."], ["@PrimaryKey(autoGenerate = true)", "Active l'incrémentation automatique de la clé primaire par SQLite."], ["@Insert(onConflict = OnConflictStrategy.REPLACE)", "En cas de conflit sur une clé déjà existante, remplace la ligne au lieu de faire planter l'application."], ["Flow<List<T>>", "Transforme une requête SQL en flux réactif : toute modification dans la table déclenche un nouvel émission instantanée."], ["version = 1", "Numéro de version de la base, à incrémenter de 1 à chaque ajout ou modification de colonne."]], "erreurs": [["Crash : Cannot access database on the main thread since it may potentially lock the UI for a long period of time", "Cette erreur majeure survient lorsque tu appelles une requête DAO d'écriture en dehors d'une Coroutine (`suspend`). Toutes les méthodes du DAO (sauf celles qui retournent un Flow) doivent être marquées `suspend` et appelées avec `viewModelScope.launch`."], ["Crash : Room cannot verify the data integrity. Looks like you've changed the schema but forgot to update the builder version", "Tu as modifié un champ dans ton `@Entity` sans changer le numéro `version = 2` dans `@Database`. En phase de développement, ajoute `.fallbackToDestructiveMigration()` dans ton `Room.databaseBuilder()`."]], "exercice": {"enonce": "Ajoute une requête dans le DAO pour compter le nombre total d'articles restant à acheter : fun compterArticlesRestants(): Flow<Int>.", "indice": "Utilise l'annotation @Query(\"SELECT COUNT(*) FROM articles WHERE estAchete = 0\").", "solution": "@Query(\"SELECT COUNT(*) FROM articles WHERE estAchete = 0\")\nfun compterArticlesRestants(): Flow<Int>"}, "quiz": {"q": "Pourquoi est-il fortement recommandé de faire renvoyer un `Flow<List<T>>` par une fonction `@Query` de Room plutôt qu'une simple `List<T>` synchrone ?", "options": ["Parce que le Flow informe automatiquement Jetpack Compose dès qu'une insertion, modification ou suppression survient dans la table", "Pour chiffrer les données stockées dans SQLite", "Parce que SQLite ne supporte pas le type List en Kotlin", "C'est une obligation du plugin KSP"], "correct": 0, "exp": "Lorsqu'une méthode `@Query` retourne un `Flow`, Room surveille automatiquement la table SQLite. Dès qu'une modification intervient (ajout, suppression, mise à jour), Room ré-exécute la requête en arrière-plan et émet la nouvelle liste : l'interface Jetpack Compose se met à jour en temps réel sans aucun code de rafraîchissement manuel !"}, "retenir": ["Room est le pont sécurisé et typé au-dessus de SQLite.", "@Entity = la table SQL ; @Dao = les requêtes ; @Database = le gestionnaire.", "Les requêtes retournant un Flow sont automatiquement réactives en temps réel.", "Les fonctions d'écriture (@Insert, @Update, @Delete) doivent TOUJOURS être `suspend`."], "prereq": ["mvvm", "viewmodel"], "suite": ["crud", "api"]}, "crud": {"id": "crud", "title": "Créer un CRUD Complet de A à Z", "niveau": 6, "level": "adv", "duration": "22 min", "quoi": "<b>CRUD</b> est l'acronyme universel pour les quatre opérations fondamentales de gestion de données : <b>C</b>reate (Créer), <b>R</b>ead (Lire), <b>U</b>pdate (Modifier) et <b>D</b>elete (Supprimer).", "pourquoi": "90% des applications mobiles (gestionnaires de tâches, carnets de contacts, fiches clients, catalogues) reposent sur ces 4 opérations. Structurer un CRUD complet et robuste de A à Z — avec dialogue de saisie, validation des données et confirmation de suppression — est le modèle d'architecture réutilisable par excellence pour réussir vos examens et projets professionnels.", "quand": "Dès qu'un utilisateur doit manipuler une collection d'enregistrements qu'il peut ajouter, consulter, éditer ou retirer en toute sécurité.", "syntaxe": "// Les 4 piliers dans le DAO\n@Insert suspend fun creer(item: Item)                // CREATE\n@Query(\"SELECT * FROM items\") fun lire(): Flow<List<Item>> // READ\n@Update suspend fun modifier(item: Item)              // UPDATE\n@Delete suspend fun supprimer(item: Item)             // DELETE", "exempleMin": "class ItemViewModel(private val dao: ItemDao) : ViewModel() {\n    val items = dao.lire().stateIn(viewModelScope, SharingStarted.Lazily, emptyList())\n    fun ajouter(nom: String) = viewModelScope.launch { dao.creer(Item(nom = nom)) }\n    fun supprimer(item: Item) = viewModelScope.launch { dao.supprimer(item) }\n}", "explication": [["CREATE (Insert)", "Ajoute une nouvelle entrée en base avec un formulaire ou une boîte de dialogue."], ["READ (Query)", "Alimente la `LazyColumn` grâce à un `Flow` réactif qui s'actualise tout seul."], ["UPDATE (Update)", "Modifie les propriétés d'un enregistrement existant (ex: marquer comme payé ou changer le titre)."], ["DELETE (Delete)", "Retire définitivement la ligne de la base, TOUJOURS précédé d'une boîte de confirmation (`AlertDialog`) pour éviter les fausses manipulations."]], "exempleReel": "package com.example.app.crud\n\nimport androidx.lifecycle.ViewModel\nimport androidx.lifecycle.viewModelScope\nimport androidx.lifecycle.compose.collectAsStateWithLifecycle\nimport androidx.compose.foundation.layout.*\nimport androidx.compose.foundation.lazy.LazyColumn\nimport androidx.compose.foundation.lazy.items\nimport androidx.compose.material.icons.Icons\nimport androidx.compose.material.icons.filled.Add\nimport androidx.compose.material.icons.filled.Delete\nimport androidx.compose.material.icons.filled.Edit\nimport androidx.compose.material3.*\nimport androidx.compose.runtime.*\nimport androidx.compose.ui.Alignment\nimport androidx.compose.ui.Modifier\nimport androidx.compose.ui.graphics.Color\nimport androidx.compose.ui.text.font.FontWeight\nimport androidx.compose.ui.tooling.preview.Preview\nimport androidx.compose.ui.unit.dp\nimport androidx.compose.ui.unit.sp\nimport kotlinx.coroutines.flow.MutableStateFlow\nimport kotlinx.coroutines.flow.StateFlow\nimport kotlinx.coroutines.flow.asStateFlow\nimport kotlinx.coroutines.launch\n\n// 1. Modèle\ndata class Produit(val id: Long, val nom: String, val prix: Double)\n\n// 2. ViewModel CRUD\nclass CrudViewModel : ViewModel() {\n    private val _produits = MutableStateFlow<List<Produit>>(\n        listOf(\n            Produit(1, \"Clavier Mécanique RGB\", 89.99),\n            Produit(2, \"Souris Ergonomique\", 45.50),\n            Produit(3, \"Écran 27 pouces 144Hz\", 249.00)\n        )\n    )\n    val produits: StateFlow<List<Produit>> = _produits.asStateFlow()\n\n    // CREATE\n    fun ajouterProduit(nom: String, prix: Double) {\n        val nouveau = Produit(id = System.currentTimeMillis(), nom = nom, prix = prix)\n        _produits.value = _produits.value + nouveau\n    }\n\n    // UPDATE\n    fun modifierProduit(produitModifie: Produit) {\n        _produits.value = _produits.value.map {\n            if (it.id == produitModifie.id) produitModifie else it\n        }\n    }\n\n    // DELETE\n    fun supprimerProduit(id: Long) {\n        _produits.value = _produits.value.filter { it.id != id }\n    }\n}\n\n// 3. Vue CRUD Complète avec Dialogues\n@OptIn(ExperimentalMaterial3Api::class)\n@Composable\nfun EcranCrudComplet(viewModel: CrudViewModel = remember { CrudViewModel() }) {\n    val produits by viewModel.produits.collectAsStateWithLifecycle()\n\n    // États pour les boîtes de dialogue\n    var afficherDialogueAjout by remember { mutableStateOf(false) }\n    var produitAEditer by remember { mutableStateOf<Produit?>(null) }\n    var produitASupprimer by remember { mutableStateOf<Produit?>(null) }\n\n    Scaffold(\n        topBar = {\n            TopAppBar(\n                title = { Text(\"Gestion Produits (CRUD)\", fontWeight = FontWeight.Bold) },\n                colors = TopAppBarDefaults.topAppBarColors(containerColor = MaterialTheme.colorScheme.primaryContainer)\n            )\n        },\n        floatingActionButton = {\n            FloatingActionButton(\n                onClick = { afficherDialogueAjout = true },\n                containerColor = Color(0xFF7F52FF),\n                contentColor = Color.White\n            ) {\n                Icon(Icons.Default.Add, contentDescription = \"Ajouter\")\n            }\n        }\n    ) { padding ->\n        // [READ] Liste dynamique\n        LazyColumn(\n            modifier = Modifier.fillMaxSize().padding(padding),\n            contentPadding = PaddingValues(16.dp),\n            verticalArrangement = Arrangement.spacedBy(8.dp)\n        ) {\n            items(produits, key = { it.id }) { produit ->\n                Card(modifier = Modifier.fillMaxWidth()) {\n                    Row(\n                        modifier = Modifier.fillMaxWidth().padding(16.dp),\n                        verticalAlignment = Alignment.CenterVertically\n                    ) {\n                        Column(modifier = Modifier.weight(1f)) {\n                            Text(produit.nom, fontWeight = FontWeight.Bold, fontSize = 16.sp)\n                            Text(String.format(\"%.2f €\", produit.prix), color = Color(0xFF1E8F72), fontWeight = FontWeight.SemiBold)\n                        }\n\n                        // Bouton UPDATE\n                        IconButton(onClick = { produitAEditer = produit }) {\n                            Icon(Icons.Default.Edit, contentDescription = \"Modifier\", tint = Color.Gray)\n                        }\n\n                        // Bouton DELETE\n                        IconButton(onClick = { produitASupprimer = produit }) {\n                            Icon(Icons.Default.Delete, contentDescription = \"Supprimer\", tint = Color(0xFFC4453A))\n                        }\n                    }\n                }\n            }\n        }\n\n        // [CREATE] Dialogue d'Ajout\n        if (afficherDialogueAjout) {\n            DialogueFormulaireProduit(\n                titre = \"Nouveau Produit\",\n                nomInitial = \"\",\n                prixInitial = \"\",\n                onConfirmer = { nom, prix ->\n                    viewModel.ajouterProduit(nom, prix)\n                    afficherDialogueAjout = false\n                },\n                onAnnuler = { afficherDialogueAjout = false }\n            )\n        }\n\n        // [UPDATE] Dialogue de Modification\n        produitAEditer?.let { produit ->\n            DialogueFormulaireProduit(\n                titre = \"Modifier le produit\",\n                nomInitial = produit.nom,\n                prixInitial = produit.prix.toString(),\n                onConfirmer = { nouveauNom, nouveauPrix ->\n                    viewModel.modifierProduit(produit.copy(nom = nouveauNom, prix = nouveauPrix))\n                    produitAEditer = null\n                },\n                onAnnuler = { produitAEditer = null }\n            )\n        }\n\n        // [DELETE] Dialogue de Confirmation\n        produitASupprimer?.let { produit ->\n            AlertDialog(\n                onDismissRequest = { produitASupprimer = null },\n                title = { Text(\"Confirmer la suppression\") },\n                text = { Text(\"Êtes-vous sûr de vouloir supprimer définitivement « \\${produit.nom} » ?\") },\n                confirmButton = {\n                    Button(\n                        onClick = {\n                            viewModel.supprimerProduit(produit.id)\n                            produitASupprimer = null\n                        },\n                        colors = ButtonDefaults.buttonColors(containerColor = MaterialTheme.colorScheme.error)\n                    ) {\n                        Text(\"Supprimer\")\n                    }\n                },\n                dismissButton = {\n                    OutlinedButton(onClick = { produitASupprimer = null }) { Text(\"Annuler\") }\n                }\n            )\n        }\n    }\n}\n\n@Composable\nfun DialogueFormulaireProduit(\n    titre: String,\n    nomInitial: String,\n    prixInitial: String,\n    onConfirmer: (String, Double) -> Unit,\n    onAnnuler: () -> Unit\n) {\n    var nom by remember { mutableStateOf(nomInitial) }\n    var prix by remember { mutableStateOf(prixInitial) }\n\n    AlertDialog(\n        onDismissRequest = onAnnuler,\n        title = { Text(titre, fontWeight = FontWeight.Bold) },\n        text = {\n            Column(verticalArrangement = Arrangement.spacedBy(10.dp)) {\n                OutlinedTextField(\n                    value = nom,\n                    onValueChange = { nom = it },\n                    label = { Text(\"Nom du produit\") },\n                    singleLine = true\n                )\n                OutlinedTextField(\n                    value = prix,\n                    onValueChange = { prix = it },\n                    label = { Text(\"Prix (€)\") },\n                    singleLine = true\n                )\n            }\n        },\n        confirmButton = {\n            Button(\n                onClick = {\n                    val prixDouble = prix.toDoubleOrNull() ?: 0.0\n                    if (nom.isNotBlank()) onConfirmer(nom, prixDouble)\n                },\n                enabled = nom.isNotBlank() && (prix.toDoubleOrNull() != null)\n            ) {\n                Text(\"Enregistrer\")\n            }\n        },\n        dismissButton = {\n            OutlinedButton(onClick = onAnnuler) { Text(\"Annuler\") }\n        }\n    )\n}", "gradle": "// build.gradle.kts (Module :app)\ndependencies {\n    implementation(\"androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0\")\n    implementation(\"androidx.lifecycle:lifecycle-runtime-compose:2.7.0\")\n    implementation(\"androidx.compose.material3:material3\")\n}", "resultat": "[ + ] Clic sur FAB  ──▶ Boîte de dialogue [CREATE] ──▶ Élément inséré !\n┌───────────────────────────────────────────┐\n│ Clavier Mécanique       89.99 €  [✎]  [🗑]│\n├───────────────────────────────────────────┤\n│ Souris Ergonomique      45.50 €  [✎]  [🗑]│\n└───────────────────────────────────────────┘\n   │ [✎] Clic Modifier ──▶ Dialogue prérempli [UPDATE]\n   │ [🗑] Clic Poubelle  ──▶ AlertDialog \"Supprimer ?\" [DELETE]", "params": [["Create", "Saisie utilisateur -> Validation non vide -> Appel ViewModel.inserer()"], ["Read", "Observation du Flow continu dans la LazyColumn (zéro rafraîchissement manuel nécessaire)"], ["Update", "Sélection de l'objet -> Pré-remplissage du formulaire -> `copy()` et mise à jour"], ["Delete", "Sélection de l'id -> AlertDialog de confirmation sécurisée -> Suppression en base"]], "erreurs": [["Supprimer un élément directement sans confirmation préalable", "Un clic accidentel sur un écran tactile est fréquent. Supprimer une donnée sans afficher d'AlertDialog de confirmation est une mauvaise pratique majeure en ergonomie mobile."], ["Modifier directement un objet sans créer de copie .copy()", "En programmation fonctionnelle et Compose, les modèles de données doivent être immuables (val). Pour modifier une propriété, utilise toujours la méthode de copie générée : `monProduit.copy(prix = nouveauPrix)`."]], "exercice": {"enonce": "Ajoute une fonctionnalité de recherche en direct au CRUD : une barre de recherche au-dessus de la liste qui filtre instantanément les produits par leur nom.", "indice": "Crée `var filtre by remember { mutableStateOf('') }`, puis `produits.filter { it.nom.contains(filtre, ignoreCase = true) }` avant de passer la liste à la LazyColumn.", "solution": "var filtre by remember { mutableStateOf(\"\") }\n\nOutlinedTextField(\n    value = filtre,\n    onValueChange = { filtre = it },\n    placeholder = { Text(\"Rechercher un produit...\") },\n    modifier = Modifier.fillMaxWidth().padding(16.dp)\n)\n\nval produitsFiltres = remember(produits, filtre) {\n    produits.filter { it.nom.contains(filtre, ignoreCase = true) }\n}\n// Afficher ensuite produitsFiltres dans items()"}, "quiz": {"q": "Pourquoi les data classes manipulées dans un CRUD Jetpack Compose doivent-elles avoir des champs déclarés avec 'val' plutôt que 'var' ?", "options": ["Parce que l'immuabilité garantit que Compose détecte avec certitude les changements de références d'objets pour déclencher la recomposition", "Parce que Kotlin interdit les 'var' dans les data classes", "Pour rendre les données compatibles avec SQLite", "Pour économiser de la mémoire vive sur le smartphone"], "correct": 0, "exp": "Compose s'appuie sur la comparaison des références pour savoir s'il doit redessiner un élément. Si un objet est mutable (var) et qu'on modifie un champ interne, la référence de l'objet reste la même : Compose ne s'en rend pas compte et n'actualise pas l'écran. L'immuabilité (val + copy()) est la règle d'or."}, "retenir": ["CRUD = Create, Read, Update, Delete.", "Utilise toujours des data classes immuables (`val`) et la fonction `.copy()`.", "Protège TOUJOURS l'opération Delete par une boîte de dialogue AlertDialog.", "La couche ViewModel orchestre le tout en isolant l'UI de la source de données."], "prereq": ["room", "viewmodel"], "suite": ["api", "navigation"]}, "api": {"id": "api", "title": "Consommer une API REST avec Retrofit & Moshi", "niveau": 7, "level": "adv", "duration": "20 min", "quoi": "<b>Retrofit</b> est le standard absolu de l'écosystème Android pour effectuer des requêtes HTTP (GET, POST, PUT, DELETE) vers un serveur web distant. Associé à un convertisseur JSON comme <b>Moshi</b> ou <b>Gson</b>, Retrofit transforme automatiquement les réponses JSON envoyées par le serveur en objets data classes Kotlin prêts à l'emploi.", "pourquoi": "Écrire du code réseau manuel avec HttpURLConnection nécessite des centaines de lignes de code complexe pour gérer les flux d'octets, les codes de statut HTTP, les timeouts et la sérialisation JSON. Retrofit transforme cette complexité en une simple **interface Kotlin annotée** (`@GET`, `@POST`), exécutée dans des coroutines fluides.", "quand": "Dès que l'application a besoin de données distantes : météo en direct, catalogue d'un site marchand, authentification utilisateur, fil d'actualités, messagerie instantanée.", "syntaxe": "// 1. Déclaration de l'interface Retrofit\ninterface ApiService {\n    @GET(\"products\")\n    suspend fun getProduits(): List<ProduitDto>\n\n    @GET(\"products/{id}\")\n    suspend fun getProduitParId(@Path(\"id\") id: Long): ProduitDto\n\n    @POST(\"products\")\n    suspend fun creerProduit(@Body produit: ProduitDto): ProduitDto\n}\n\n// 2. Création du client singleton\nval retrofit = Retrofit.Builder()\n    .baseUrl(\"https://api.monsite.com/v1/\")\n    .addConverterFactory(MoshiConverterFactory.create())\n    .build()\n\nval api = retrofit.create(ApiService::class.java)", "exempleMin": "interface MeteoApi {\n    @GET(\"weather\")\n    suspend fun getMeteo(@Query(\"city\") ville: String): MeteoResponse\n}\n\n// Appel dans une coroutine\nval meteo = api.getMeteo(\"Paris\")", "explication": [["@GET(\"products\")", "Indique que cette fonction effectue une requête HTTP GET vers l'URL https://.../products."], ["suspend fun", "La requête s'exécute de manière asynchrone hors du thread UI pour ne jamais faire saccader l'écran."], ["MoshiConverterFactory", "Moteur qui analyse le JSON brut reçu du serveur et instancie automatiquement la data class Kotlin correspondante."], ["@Path(\"id\") / @Query(\"...\")", "Insère dynamiquement des variables dans le chemin ou les paramètres de l'URL (?city=Paris)."]], "exempleReel": "package com.example.app.network\n\nimport androidx.lifecycle.ViewModel\nimport androidx.lifecycle.viewModelScope\nimport androidx.lifecycle.compose.collectAsStateWithLifecycle\nimport androidx.compose.foundation.layout.*\nimport androidx.compose.foundation.lazy.LazyColumn\nimport androidx.compose.foundation.lazy.items\nimport androidx.compose.material3.*\nimport androidx.compose.runtime.*\nimport androidx.compose.ui.Alignment\nimport androidx.compose.ui.Modifier\nimport androidx.compose.ui.graphics.Color\nimport androidx.compose.ui.text.font.FontWeight\nimport androidx.compose.ui.tooling.preview.Preview\nimport androidx.compose.ui.unit.dp\nimport androidx.compose.ui.unit.sp\nimport com.squareup.moshi.Json\nimport com.squareup.moshi.Moshi\nimport com.squareup.moshi.kotlin.reflect.KotlinJsonAdapterFactory\nimport kotlinx.coroutines.flow.MutableStateFlow\nimport kotlinx.coroutines.flow.StateFlow\nimport kotlinx.coroutines.flow.asStateFlow\nimport kotlinx.coroutines.launch\nimport retrofit2.Retrofit\nimport retrofit2.converter.moshi.MoshiConverterFactory\nimport retrofit2.http.GET\nimport java.io.IOException\n\n// ══════════════════════════════════════════\n// 1. MODÈLE DTO (Data Transfer Object)\n// ══════════════════════════════════════════\ndata class ProduitApiDto(\n    val id: Long,\n    val title: String,\n    val price: Double,\n    @Json(name = \"description\") val description: String,\n    val category: String\n)\n\n// ══════════════════════════════════════════\n// 2. INTERFACE RETROFIT\n// ══════════════════════════════════════════\ninterface FakeStoreApiService {\n    @GET(\"products\")\n    suspend fun fetchProduits(): List<ProduitApiDto>\n}\n\n// ══════════════════════════════════════════\n// 3. CLIENT SINGLETON RÉSEAU\n// ══════════════════════════════════════════\nobject RetrofitClient {\n    private const val BASE_URL = \"https://fakestoreapi.com/\"\n\n    private val moshi = Moshi.Builder()\n        .add(KotlinJsonAdapterFactory())\n        .build()\n\n    val apiService: FakeStoreApiService by lazy {\n        Retrofit.Builder()\n            .baseUrl(BASE_URL)\n            .addConverterFactory(MoshiConverterFactory.create(moshi))\n            .build()\n            .create(FakeStoreApiService::class.java)\n    }\n}\n\n// ══════════════════════════════════════════\n// 4. VIEWMODEL & ÉTATS RÉSEAU ROBUSTES\n// ══════════════════════════════════════════\nsealed interface ApiUiState {\n    object Chargement : ApiUiState\n    data class Succes(val catalogue: List<ProduitApiDto>) : ApiUiState\n    data class Erreur(val message: String) : ApiUiState\n}\n\nclass ApiProduitsViewModel(\n    private val api: FakeStoreApiService = RetrofitClient.apiService\n) : ViewModel() {\n\n    private val _uiState = MutableStateFlow<ApiUiState>(ApiUiState.Chargement)\n    val uiState: StateFlow<ApiUiState> = _uiState.asStateFlow()\n\n    init {\n        chargerCatalogue()\n    }\n\n    fun chargerCatalogue() {\n        viewModelScope.launch {\n            _uiState.value = ApiUiState.Chargement\n            try {\n                // Appel réseau asynchrone non-bloquant\n                val reponse = api.fetchProduits()\n                _uiState.value = ApiUiState.Succes(reponse)\n            } catch (e: IOException) {\n                _uiState.value = ApiUiState.Erreur(\"Pas de connexion Internet. Vérifiez vos données mobiles.\")\n            } catch (e: Exception) {\n                _uiState.value = ApiUiState.Erreur(\"Erreur serveur : \\${e.localizedMessage}\")\n            }\n        }\n    }\n}\n\n// ══════════════════════════════════════════\n// 5. VUE COMPOSE\n// ══════════════════════════════════════════\n@OptIn(ExperimentalMaterial3Api::class)\n@Composable\nfun EcranCatalogueApi(viewModel: ApiProduitsViewModel = remember { ApiProduitsViewModel() }) {\n    val state by viewModel.uiState.collectAsStateWithLifecycle()\n\n    Scaffold(\n        topBar = {\n            TopAppBar(\n                title = { Text(\"Boutique en ligne (API REST)\", fontWeight = FontWeight.Bold) },\n                colors = TopAppBarDefaults.topAppBarColors(containerColor = MaterialTheme.colorScheme.primaryContainer)\n            )\n        }\n    ) { padding ->\n        Box(\n            modifier = Modifier.fillMaxSize().padding(padding),\n            contentAlignment = Alignment.Center\n        ) {\n            when (val currentState = state) {\n                is ApiUiState.Chargement -> {\n                    Column(horizontalAlignment = Alignment.CenterHorizontally) {\n                        CircularProgressIndicator(color = Color(0xFF7F52FF))\n                        Spacer(modifier = Modifier.height(14.dp))\n                        Text(\"Interrogation du serveur REST...\", color = Color.Gray)\n                    }\n                }\n                is ApiUiState.Erreur -> {\n                    Column(\n                        horizontalAlignment = Alignment.CenterHorizontally,\n                        modifier = Modifier.padding(24.dp)\n                    ) {\n                        Text(text = \"⚠️ \\${currentState.message}\", color = MaterialTheme.colorScheme.error)\n                        Spacer(modifier = Modifier.height(16.dp))\n                        Button(onClick = { viewModel.chargerCatalogue() }) {\n                            Text(\"Réessayer la connexion\")\n                        }\n                    }\n                }\n                is ApiUiState.Succes -> {\n                    LazyColumn(\n                        modifier = Modifier.fillMaxSize(),\n                        contentPadding = PaddingValues(16.dp),\n                        verticalArrangement = Arrangement.spacedBy(10.dp)\n                    ) {\n                        items(currentState.catalogue, key = { it.id }) { produit ->\n                            Card(modifier = Modifier.fillMaxWidth()) {\n                                Column(modifier = Modifier.padding(16.dp)) {\n                                    Text(produit.title, fontWeight = FontWeight.Bold, maxLines = 2)\n                                    Spacer(modifier = Modifier.height(4.dp))\n                                    Text(\n                                        text = \"\\${produit.price} $\",\n                                        color = Color(0xFF1E8F72),\n                                        fontWeight = FontWeight.ExtraBold,\n                                        fontSize = 18.sp\n                                    )\n                                    Text(\n                                        text = produit.category.uppercase(),\n                                        style = MaterialTheme.typography.bodySmall,\n                                        color = Color.Gray\n                                    )\n                                }\n                            }\n                        }\n                    }\n                }\n            }\n        }\n    }\n}", "gradle": "// 1. AndroidManifest.xml (OBLIGATOIRE !)\n// <uses-permission android:name=\"android.permission.INTERNET\" />\n\n// 2. build.gradle.kts (Module :app)\ndependencies {\n    val retrofitVersion = \"2.11.0\"\n    val moshiVersion = \"1.15.1\"\n\n    implementation(\"com.squareup.retrofit2:retrofit:$retrofitVersion\")\n    implementation(\"com.squareup.retrofit2:converter-moshi:$retrofitVersion\")\n    implementation(\"com.squareup.moshi:moshi-kotlin:$moshiVersion\")\n    implementation(\"com.squareup.okhttp3:logging-interceptor:4.12.0\")\n}", "resultat": "Smartphone Android\n       │  Requête HTTP : GET https://api.monsite.com/products\n       ▼\nServeur Web distant\n       │  Réponse : 200 OK  [{\"id\":1, \"title\":\"Laptop\", \"price\":999.0}]\n       ▼\nRetrofit + Moshi\n       │  Désérialisation automatique en List<ProduitApiDto>\n       ▼\nViewModel ──▶ Émet ApiUiState.Succes ──▶ LazyColumn s'affiche !", "params": [["@GET / @POST / @PUT / @DELETE", "Verbes HTTP standard indiquant le type d'opération sur la ressource REST."], ["@Path(\"param\")", "Remplace un tronçon de l'URL par une valeur dynamique, ex: users/{id}."], ["@Query(\"param\")", "Ajoute un paramètre d'URL standard, ex: search?q=kotlin."], ["@Body", "Envoie un objet Kotlin sérialisé en JSON dans le corps de la requête HTTP."], ["@Json(name = \"champ_json\")", "Mappe un nom de clé JSON vers un nom de variable Kotlin différent."]], "erreurs": [["Crash : SecurityException: Permission denied (missing INTERNET permission)", "Tu as oublié d'ajouter la permission internet dans le fichier `app/src/main/AndroidManifest.xml`. Ajoute tout en haut : `<uses-permission android:name=\"android.permission.INTERNET\" />`."], ["Crash : java.net.UnknownServiceException: CLEARTEXT communication to ... not permitted by network security policy", "Depuis Android 9, les requêtes HTTP non chiffrées (`http://`) sont bloquées par défaut pour des raisons de sécurité. Utilise impérativement une adresse sécurisée `https://` !"], ["JsonDataException : Required value 'nom' missing at $[0]", "Le nom des champs dans votre data class ne correspond pas exactement aux clés du JSON renvoyé par le serveur. Utilise l'annotation `@Json(name = \"cle_exacte\")`."]], "exercice": {"enonce": "Ajoute une méthode d'API @GET('products/category/{cat}') pour charger uniquement les articles d'une catégorie donnée (ex: 'jewelery').", "indice": "Déclare @GET('products/category/{categorie}') suspend fun getProduitsParCategorie(@Path('categorie') cat: String): List<ProduitApiDto>.", "solution": "@GET(\"products/category/{nomCategorie}\")\nsuspend fun getProduitsParCategorie(\n    @Path(\"nomCategorie\") categorie: String\n): List<ProduitApiDto>"}, "quiz": {"q": "Quelle permission indispensable doit impérativement figurer dans le fichier `AndroidManifest.xml` pour qu'une application puisse exécuter des requêtes Retrofit ?", "options": ["<uses-permission android:name=\"android.permission.INTERNET\" />", "<uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\" />", "<uses-permission android:name=\"android.permission.FOREGROUND_SERVICE\" />", "Aucune permission n'est requise pour Retrofit"], "correct": 0, "exp": "Sans la permission `android.permission.INTERNET` dans le manifeste Android, le système d'exploitation bloque immédiatement toute tentative d'ouverture de socket réseau et lève une `SecurityException` fatale."}, "retenir": ["Retrofit décrit les routes HTTP via une interface Kotlin annotée.", "N'oublie JAMAIS la permission INTERNET dans AndroidManifest.xml.", "Utilise toujours `suspend fun` pour exécuter les requêtes en Coroutine.", "Gère toujours les 3 états : Chargement, Données reçues (Succès), et Erreur réseau."], "prereq": ["mvvm", "viewmodel"], "suite": ["navigation"]}, "navigation": {"id": "navigation", "title": "Navigation Multi-Écrans avec Navigation Compose", "niveau": 8, "level": "mid", "duration": "18 min", "quoi": "<b>Navigation Compose</b> est la bibliothèque officielle permettant de gérer les transitions entre différents écrans d'une application Jetpack Compose, d'ordonnancer l'historique de navigation (la pile arrière ou <b>BackStack</b>), et de passer des arguments typés d'un écran source à un écran de destination.", "pourquoi": "Dans l'ancien monde Android, chaque écran était une Activity ou un Fragment lourd avec un cycle de vie complexe. Avec Compose, une application moderne ne possède qu'une **seule Activity unique** (Single-Activity Architecture). Navigation Compose permet de basculer de façon ultra-légère entre des fonctions Composable comme s'il s'agissait de pages web, tout en gérant parfaitement le bouton retour physique du téléphone.", "quand": "Dès que l'application comporte au moins deux écrans différents : Accueil -> Détail du produit, Écran de Connexion -> Tableau de bord, Liste -> Paramètres.", "syntaxe": "// 1. Création du contrôleur\nval navController = rememberNavController()\n\n// 2. Définition du graphe de navigation\nNavHost(navController = navController, startDestination = \"accueil\") {\n    composable(\"accueil\") {\n        EcranAccueil(onVoirDetails = { id -> navController.navigate(\"details/$id\") })\n    }\n    composable(\n        route = \"details/{articleId}\",\n        arguments = listOf(navArgument(\"articleId\") { type = NavType.LongType })\n    ) { backStackEntry ->\n        val id = backStackEntry.arguments?.getLong(\"articleId\") ?: 0L\n        EcranDetails(articleId = id, onRetour = { navController.popBackStack() })\n    }\n}", "exempleMin": "@Composable\nfun AppNavigation() {\n    val navController = rememberNavController()\n    NavHost(navController = navController, startDestination = \"page1\") {\n        composable(\"page1\") {\n            Button(onClick = { navController.navigate(\"page2\") }) { Text(\"Aller page 2\") }\n        }\n        composable(\"page2\") {\n            Button(onClick = { navController.popBackStack() }) { Text(\"Retour\") }\n        }\n    }\n}", "explication": [["rememberNavController()", "Instancie et conserve en mémoire le contrôleur central qui garde en mémoire la pile des écrans visités."], ["NavHost(..., startDestination = ...)", "Le conteneur qui remplace dynamiquement l'écran affiché en fonction de la route active."], ["composable(\"details/{id}\")", "Associe un Composable à une route textuelle paramétrée (similaire à une URL web)."], ["navController.navigate(\"...\")", "Pousse un nouvel écran sur le dessus de la pile."], ["navController.popBackStack()", "Dépile l'écran actuel et revient fidèlement à l'écran précédent."]], "exempleReel": "package com.example.app.navigation\n\nimport androidx.compose.foundation.clickable\nimport androidx.compose.foundation.layout.*\nimport androidx.compose.foundation.lazy.LazyColumn\nimport androidx.compose.foundation.lazy.items\nimport androidx.compose.material.icons.Icons\nimport androidx.compose.material.icons.filled.ArrowBack\nimport androidx.compose.material.icons.filled.ChevronRight\nimport androidx.compose.material3.*\nimport androidx.compose.runtime.Composable\nimport androidx.compose.ui.Alignment\nimport androidx.compose.ui.Modifier\nimport androidx.compose.ui.graphics.Color\nimport androidx.compose.ui.text.font.FontWeight\nimport androidx.compose.ui.tooling.preview.Preview\nimport androidx.compose.ui.unit.dp\nimport androidx.compose.ui.unit.sp\nimport androidx.navigation.NavHostController\nimport androidx.navigation.NavType\nimport androidx.navigation.compose.NavHost\nimport androidx.navigation.compose.composable\nimport androidx.navigation.compose.rememberNavController\nimport androidx.navigation.navArgument\n\n// ══════════════════════════════════════════\n// 1. ROUTES SÉCURISÉES (Pattern Sealing)\n// ══════════════════════════════════════════\nsealed class Ecran(val route: String) {\n    object Catalogue : Ecran(\"catalogue\")\n    object Detail : Ecran(\"detail/{produitId}\") {\n        fun creerRoute(produitId: Int) = \"detail/$produitId\"\n    }\n}\n\ndata class ArticleDemo(val id: Int, val titre: String, val prix: Double, val description: String)\n\nval CATALOGUE_FICTIF = listOf(\n    ArticleDemo(101, \"MacBook Pro M3\", 1999.0, \"Superbe écran Liquid Retina XDR et puce ultra puissante.\"),\n    ArticleDemo(102, \"Clavier Sans-Fil\", 119.0, \"Touches silencieuses et rétroéclairage intelligent.\"),\n    ArticleDemo(103, \"Moniteur 4K 32\"\", 699.0, \"Fidélité des couleurs exceptionnelle pour les designers.\")\n)\n\n// ══════════════════════════════════════════\n// 2. NAVHOST PRINCIPAL\n// ══════════════════════════════════════════\n@Composable\nfun ApplicationNavigationComplete(\n    navController: NavHostController = rememberNavController()\n) {\n    NavHost(\n        navController = navController,\n        startDestination = Ecran.Catalogue.route\n    ) {\n        // ÉCRAN 1 : Catalogue\n        composable(route = Ecran.Catalogue.route) {\n            EcranCatalogue(\n                articles = CATALOGUE_FICTIF,\n                onArticleSelectionne = { id ->\n                    navController.navigate(Ecran.Detail.creerRoute(id))\n                }\n            )\n        }\n\n        // ÉCRAN 2 : Détails avec argument\n        composable(\n            route = Ecran.Detail.route,\n            arguments = listOf(\n                navArgument(\"produitId\") {\n                    type = NavType.IntType\n                    nullable = false\n                }\n            )\n        ) { backStackEntry ->\n            val id = backStackEntry.arguments?.getInt(\"produitId\") ?: 0\n            val article = CATALOGUE_FICTIF.find { it.id == id }\n\n            EcranDetailArticle(\n                article = article,\n                onBoutonRetour = { navController.popBackStack() }\n            )\n        }\n    }\n}\n\n// ══════════════════════════════════════════\n// 3. COMPOSABLES D'ÉCRANS\n// ════════════
