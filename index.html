<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apps Mobiles 2 — Kotlin + Jetpack Compose</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --paper:#F3F4F7;
  --panel:#FFFFFF;
  --ink:#171A21;
  --ink-soft:#565D6D;
  --line:#DFE2E8;
  --kotlin:#7B5CFA;
  --kotlin-dim:#EFEBFF;
  --amber:#D98A1B;
  --amber-dim:#FBF0DD;
  --teal:#1E8F72;
  --teal-dim:#E3F5EF;
  --red:#C4453A;
  --red-dim:#FBEAE8;
  --code-bg:#171A21;
  --code-ink:#E7E9F0;
  --radius:6px;
  --sidebar-w:248px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:'Manrope',sans-serif; font-weight:800; margin:0 0 .4em 0; letter-spacing:-.01em;}
code,pre,.mono{font-family:'JetBrains Mono',monospace;}
a{color:inherit;}
button{font-family:inherit; cursor:pointer;}
::selection{background:var(--kotlin-dim);}

/* ============ LAYOUT SHELL ============ */
.shell{display:flex; min-height:100vh;}
.sidebar{
  width:var(--sidebar-w); flex-shrink:0;
  background:var(--panel); border-right:1px solid var(--line);
  padding:22px 16px; position:sticky; top:0; height:100vh; overflow-y:auto;
}
.brand{display:flex; align-items:center; gap:10px; padding:0 6px 20px 6px; border-bottom:1px solid var(--line); margin-bottom:16px;}
.brand-mark{width:30px; height:30px; border-radius:7px; background:var(--kotlin); display:flex; align-items:center; justify-content:center; color:#fff; font-family:'JetBrains Mono'; font-weight:700; font-size:13px;}
.brand-text{font-family:'Manrope'; font-weight:800; font-size:14.5px; line-height:1.2;}
.brand-text span{display:block; font-family:'Inter'; font-weight:500; color:var(--ink-soft); font-size:11.5px;}

.navgroup{margin-bottom:18px;}
.navgroup-label{font-size:11px; color:var(--ink-soft); padding:0 10px 6px 10px; font-weight:600;}
.navitem{
  display:flex; align-items:center; gap:9px;
  padding:8px 10px; border-radius:var(--radius); font-size:13.6px; font-weight:500;
  color:var(--ink-soft); text-decoration:none; margin-bottom:1px; border:none; background:none; width:100%; text-align:left;
}
.navitem svg{flex-shrink:0; opacity:.75;}
.navitem:hover{background:var(--paper); color:var(--ink);}
.navitem.active{background:var(--kotlin-dim); color:var(--kotlin); font-weight:700;}
.navitem.active svg{opacity:1;}

main{flex:1; min-width:0;}
.topbar{
  position:sticky; top:0; z-index:5; background:rgba(243,244,247,.92); backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line); padding:14px 32px; display:flex; gap:14px; align-items:center;
}
.searchbox{
  flex:1; max-width:480px; display:flex; align-items:center; gap:8px;
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:8px 12px;
}
.searchbox input{border:none; outline:none; background:none; flex:1; font-family:inherit; font-size:13.5px; color:var(--ink);}
.searchbox svg{opacity:.5; flex-shrink:0;}
.content{padding:34px 40px 80px 40px; max-width:920px;}

/* ============ SHARED WIDGETS ============ */
.eyebrow-free-title{margin-bottom:22px;}
.sub{color:var(--ink-soft); font-size:15px; margin-bottom:6px;}

.grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
@media(max-width:760px){.grid2{grid-template-columns:1fr;}}

.card{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  padding:18px 20px;
}
.course-card{border-left:3px solid var(--kotlin);}
.course-card h4{font-size:15.5px; margin-bottom:2px;}
.course-card .meta{font-size:12.5px; color:var(--ink-soft); margin-bottom:10px;}
.bar{height:6px; background:var(--line); border-radius:99px; overflow:hidden; margin-bottom:10px;}
.bar > i{display:block; height:100%; background:var(--kotlin); border-radius:99px;}
.go-btn{
  border:1px solid var(--kotlin); color:var(--kotlin); background:none; padding:6px 13px;
  border-radius:var(--radius); font-size:12.8px; font-weight:600;
}
.go-btn:hover{background:var(--kotlin); color:#fff;}

.badge{display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:600; padding:3px 9px; border-radius:99px;}
.badge.beg{background:var(--teal-dim); color:var(--teal);}
.badge.mid{background:var(--amber-dim); color:var(--amber);}
.badge.adv{background:var(--red-dim); color:var(--red);}
.badge.dur{background:var(--paper); color:var(--ink-soft); border:1px solid var(--line);}

.pill-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px;}

/* level path */
.level{
  border:1px solid var(--line); border-radius:var(--radius); background:var(--panel); margin-bottom:12px; overflow:hidden;
}
.level-head{display:flex; align-items:center; justify-content:space-between; padding:14px 18px; cursor:pointer;}
.level-head h4{margin:0; font-size:14.5px;}
.level-num{font-family:'JetBrains Mono'; font-size:12px; color:var(--kotlin); font-weight:700; margin-right:10px;}
.level-body{padding:0 18px 16px 18px; display:none; border-top:1px solid var(--line); padding-top:12px;}
.level.open .level-body{display:block;}
.level.open .chev{transform:rotate(90deg);}
.chev{transition:transform .15s; color:var(--ink-soft);}
.chip-list{display:flex; flex-wrap:wrap; gap:7px;}
.chip{
  font-size:12.6px; padding:5px 11px; border-radius:99px; border:1px solid var(--line); background:var(--paper);
  display:flex; align-items:center; gap:5px;
}
.chip.linkable{border-color:var(--kotlin); color:var(--kotlin); background:var(--kotlin-dim); cursor:pointer; font-weight:600;}
.chip .dot{width:5px; height:5px; border-radius:50%; background:var(--teal);}

/* lesson page */
.lesson-header{margin-bottom:26px;}
.back-link{display:inline-flex; align-items:center; gap:6px; color:var(--ink-soft); font-size:13px; text-decoration:none; margin-bottom:14px; font-weight:600;}
.back-link:hover{color:var(--kotlin);}
.lesson-header h1{font-size:26px;}
.lesson-meta{display:flex; gap:10px; align-items:center; margin-top:8px;}

.section-block{margin-bottom:26px;}
.section-block h3{font-size:12.5px; text-transform:none; color:var(--kotlin); font-weight:700; margin-bottom:10px; display:flex; align-items:center; gap:7px;}
.section-block h3 .num{font-family:'JetBrains Mono'; background:var(--kotlin-dim); color:var(--kotlin); width:20px; height:20px; border-radius:5px; display:inline-flex; align-items:center; justify-content:center; font-size:11px;}
.section-block p{margin:0 0 10px 0; color:var(--ink);}
hr.sep{border:none; border-top:1px solid var(--line); margin:26px 0;}

.codebox{
  background:var(--code-bg); color:var(--code-ink); border-radius:var(--radius); padding:16px 18px; overflow-x:auto;
  font-size:13px; line-height:1.65; position:relative; margin-bottom:6px;
}
.codebox pre{margin:0; white-space:pre;}
.copy-btn{
  position:absolute; top:10px; right:10px; background:#2A2D38; color:#CFD3E0; border:none; border-radius:5px;
  padding:5px 9px; font-size:11px; font-family:'JetBrains Mono';
}
.copy-btn:hover{background:#3A3E4C;}
.result-box{
  background:var(--paper); border:1px dashed var(--line); border-radius:var(--radius); padding:16px 18px;
  font-family:'JetBrains Mono'; font-size:12.5px; white-space:pre; color:var(--ink-soft); overflow-x:auto;
}
.explain-list{list-style:none; margin:0; padding:0;}
.explain-list li{display:flex; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); font-size:14px;}
.explain-list li:last-child{border-bottom:none;}
.explain-list code{background:var(--kotlin-dim); color:var(--kotlin); padding:1px 6px; border-radius:4px; font-size:12.5px; flex-shrink:0; height:fit-content;}

.param-table{width:100%; border-collapse:collapse; font-size:13.5px;}
.param-table th{text-align:left; font-size:11.5px; color:var(--ink-soft); font-weight:600; padding:6px 10px; border-bottom:1px solid var(--line);}
.param-table td{padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:top;}
.param-table td:first-child{font-family:'JetBrains Mono'; color:var(--kotlin); font-size:12.5px; white-space:nowrap;}

.err-item{border:1px solid var(--red-dim); background:#FEFAF9; border-radius:var(--radius); padding:12px 14px; margin-bottom:10px;}
.err-item .err-head{font-family:'JetBrains Mono'; color:var(--red); font-size:12.5px; margin-bottom:6px; font-weight:700;}
.err-item .err-fix{font-size:13px; color:var(--ink-soft);}

.exercise-box{border:1px solid var(--amber-dim); background:#FFFCF6; border-radius:var(--radius); padding:16px 18px;}
.exercise-box summary{cursor:pointer; font-weight:600; color:var(--amber); font-size:13.5px;}

.quiz-box{border:1px solid var(--line); background:var(--panel); border-radius:var(--radius); padding:18px 20px;}
.quiz-q{font-weight:700; margin-bottom:12px; font-size:14.5px;}
.quiz-opt{display:block; width:100%; text-align:left; padding:10px 13px; border:1px solid var(--line); border-radius:var(--radius); background:var(--panel); margin-bottom:8px; font-size:13.5px;}
.quiz-opt:hover{border-color:var(--kotlin);}
.quiz-opt.correct{background:var(--teal-dim); border-color:var(--teal); color:var(--teal); font-weight:600;}
.quiz-opt.wrong{background:var(--red-dim); border-color:var(--red); color:var(--red); font-weight:600;}
.quiz-fb{margin-top:10px; font-size:13.5px; color:var(--ink-soft); display:none;}

.retain-list{list-style:none; margin:0; padding:0;}
.retain-list li{display:flex; gap:8px; align-items:flex-start; padding:5px 0; font-size:14px;}
.retain-list li::before{content:"✓"; color:var(--teal); font-weight:700; flex-shrink:0;}

.lesson-nav{display:flex; justify-content:space-between; gap:10px; margin-top:30px;}
.lesson-nav button{padding:9px 16px; border-radius:var(--radius); border:1px solid var(--line); background:var(--panel); font-size:13px; font-weight:600;}
.lesson-nav .finish{background:var(--teal); color:#fff; border-color:var(--teal);}
.lesson-nav .finish.done{background:var(--teal-dim); color:var(--teal);}

.related-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;}

/* comment faire / search */
.qa-item{border:1px solid var(--line); border-radius:var(--radius); background:var(--panel); padding:14px 16px; margin-bottom:9px; display:flex; justify-content:space-between; align-items:center; gap:12px;}
.qa-item span{font-size:14px; font-weight:500;}
.qa-item button{background:none; border:none; color:var(--kotlin); font-weight:700; font-size:13px;}

/* components library */
.comp-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px;}
.comp-tile{border:1px solid var(--line); background:var(--panel); border-radius:var(--radius); padding:14px; cursor:pointer;}
.comp-tile:hover{border-color:var(--kotlin);}
.comp-tile .name{font-family:'JetBrains Mono'; font-weight:700; font-size:13px; color:var(--kotlin);}
.comp-tile .cat{font-size:11.5px; color:var(--ink-soft); margin-top:3px;}

/* cheatsheet */
.cheat-card{margin-bottom:20px;}
.cheat-row{display:flex; justify-content:space-between; gap:14px; padding:8px 0; border-bottom:1px solid var(--line); font-size:13.3px;}
.cheat-row:last-child{border-bottom:none;}
.cheat-row code{font-family:'JetBrains Mono'; color:var(--kotlin); font-size:12.5px;}
.cheat-row span{color:var(--ink-soft); text-align:right; max-width:60%;}

/* glossary */
.gloss-letter{font-family:'Manrope'; font-weight:800; color:var(--kotlin); font-size:13px; margin:22px 0 8px 0;}
.gloss-item{padding:9px 0; border-bottom:1px solid var(--line);}
.gloss-item b{font-family:'JetBrains Mono'; font-size:13.5px;}
.gloss-item p{margin:3px 0 0 0; font-size:13.3px; color:var(--ink-soft);}

.empty{padding:40px 20px; text-align:center; color:var(--ink-soft); border:1px dashed var(--line); border-radius:var(--radius);}
.view{display:none;}
.view.active{display:block;}
.hidden{display:none !important;}

@media(max-width:820px){
  .sidebar{position:fixed; left:-260px; top:0; z-index:20; transition:left .18s; box-shadow:0 0 0 9999px rgba(0,0,0,0);}
  .sidebar.open{left:0; box-shadow:0 0 0 9999px rgba(0,0,0,.35);}
  .content{padding:24px 18px 90px 18px;}
  .topbar{padding:12px 16px;}
  .menu-btn{display:flex !important;}
}
.menu-btn{display:none; align-items:center; justify-content:center; width:34px; height:34px; border:1px solid var(--line); background:var(--panel); border-radius:var(--radius); flex-shrink:0;}
</style>
</head>
<body>

<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">K</div>
      <div class="brand-text">Apps Mobiles 2<span>Kotlin · Compose · MVVM</span></div>
    </div>

    <div class="navgroup">
      <div class="navitem-list" id="mainNav">
        <button class="navitem active" data-view="dashboard">🏠 Accueil</button>
        <button class="navitem" data-view="parcours">🧭 Parcours</button>
        <button class="navitem" data-view="comment">💡 Comment faire ?</button>
        <button class="navitem" data-view="composants">🧩 Composants</button>
        <button class="navitem" data-view="cheatsheets">⚡ Cheat Sheets</button>
        <button class="navitem" data-view="glossaire">📖 Glossaire</button>
        <button class="navitem" data-view="quiz">📝 Quiz</button>
        <button class="navitem" data-view="favoris">⭐ Favoris</button>
      </div>
    </div>

    <div class="navgroup">
      <div class="navgroup-label">Leçons</div>
      <div id="lessonNavList"></div>
    </div>
  </aside>

  <main>
    <div class="topbar">
      <button class="menu-btn" id="menuBtn">☰</button>
      <div class="searchbox">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="searchInput" placeholder="Rechercher un concept, ex: « faire une liste »…">
      </div>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>

<script>
/* ======================================================================
   DONNÉES — chaque leçon suit le format en 13 parties de la spec.
   Structure pensée pour être étendue facilement (ajouter une entrée).
   ====================================================================== */

const LESSONS = {

  card: {
    id:"card", title:"Créer une Card", niveau:2, level:"beg", duration:"10 min",
    quoi:"Une <b>Card</b> est une boîte visuelle avec une légère élévation, utilisée pour regrouper plusieurs éléments (image, texte, bouton) qui appartiennent ensemble — comme une fiche produit ou un profil.",
    pourquoi:"Sans Card, tes éléments flottent sans regroupement visuel clair. La Card crée une unité que l'œil identifie immédiatement comme « un seul bloc d'information ».",
    quand:"Utilise une Card pour : une fiche produit, un profil utilisateur, un élément de liste avec plusieurs infos, une notification.",
    syntaxe:`Card(
    modifier = Modifier,
    elevation = CardDefaults.cardElevation(),
    shape = RoundedCornerShape(12.dp)
) {
    // contenu
}`,
    exempleMin:`Card {
    Text("Bonjour")
}`,
    explication:[
      ["Card {","Ouvre le conteneur. Tout ce qui est à l'intérieur des accolades sera regroupé visuellement."],
      ["Column {","Empile les enfants verticalement à l'intérieur de la Card."],
      ["Text(\"Ordinateur\")","Affiche le nom du produit."],
      ["Button(onClick = {})","Crée un bouton cliquable ; le code entre accolades s'exécute au clic."]
    ],
    exempleReel:`Card(
    modifier = Modifier
        .fillMaxWidth()
        .padding(12.dp)
) {
    Column(modifier = Modifier.padding(16.dp)) {
        Text("Ordinateur", fontWeight = FontWeight.Bold)
        Text("999 \$")
        Spacer(modifier = Modifier.height(8.dp))
        Button(onClick = { /* acheter */ }) {
            Text("Acheter")
        }
    }
}`,
    resultat:`┌─────────────────────────┐
│ Ordinateur              │
│ 999 $                   │
│                         │
│  [ Acheter ]            │
└─────────────────────────┘`,
    params:[
      ["modifier","Contrôle taille, marges, clics… (voir Modifier Cheat Sheet)"],
      ["shape","Forme des coins, ex: RoundedCornerShape(12.dp)"],
      ["elevation","Hauteur de l'ombre portée"],
      ["colors","Couleur de fond via CardDefaults.cardColors(...)"]
    ],
    erreurs:[
      ["Le contenu déborde de la Card","Il manque un Modifier.padding() à l'intérieur — la Card ne met pas de marge automatiquement."],
      ["La Card prend toute la largeur sans le vouloir","fillMaxWidth() a été ajouté par erreur sur le Modifier — retire-le si tu veux une taille automatique."]
    ],
    exercice:{
      enonce:"Crée une Card affichant une recette : nom, temps de préparation, et un bouton « Voir la recette ».",
      indice:"Utilise Card → Column → deux Text → Button, comme dans l'exemple réel.",
    },
    quiz:{
      q:"Que faut-il ajouter pour éviter que le texte touche les bords d'une Card ?",
      options:["Modifier.padding() sur le contenu interne","Rien, c'est automatique","elevation plus grande","Une seconde Card"],
      correct:0,
      exp:"La Card ne met pas de marge interne par défaut : il faut appliquer un Modifier.padding() sur le Column/Row à l'intérieur."
    },
    retenir:["Card regroupe visuellement plusieurs éléments.","Elle n'a pas de padding interne par défaut — ajoute-le toi-même.","On combine presque toujours Card + Column/Row + Modifier.","shape et elevation contrôlent son style."],
    prereq:["Column","Modifier"], suite:["state","lazycolumn"]
  },

  lazycolumn: {
    id:"lazycolumn", title:"Afficher une liste (LazyColumn)", niveau:3, level:"beg", duration:"12 min",
    quoi:"<b>LazyColumn</b> affiche une liste verticale qui ne crée à l'écran que les éléments visibles, même si la liste contient des milliers d'items.",
    pourquoi:"Avec un simple Column + verticalScroll, Compose crée TOUS les éléments d'un coup, même ceux hors écran. Pour une longue liste (produits, messages, contacts), ça devient lent. LazyColumn règle ce problème.",
    quand:"Dès que tu affiches une liste dynamique dont la taille peut être grande ou inconnue : produits, contacts, messages, résultats de recherche.",
    syntaxe:`LazyColumn {
    items(maListe) { element ->
        // un item
    }
}`,
    exempleMin:`LazyColumn {
    items(produits) { produit ->
        Text(produit.nom)
    }
}`,
    explication:[
      ["LazyColumn {","Crée une liste verticale « paresseuse »."],
      ["items(produits)","Parcourt la liste `produits` et génère un bloc pour chaque élément."],
      ["{ produit -> ... }","`produit` représente l'élément courant à chaque itération."]
    ],
    exempleReel:`LazyColumn(
    modifier = Modifier.fillMaxSize(),
    contentPadding = PaddingValues(12.dp),
    verticalArrangement = Arrangement.spacedBy(8.dp)
) {
    items(produits) { produit ->
        Card(modifier = Modifier.fillMaxWidth()) {
            Column(modifier = Modifier.padding(12.dp)) {
                Text(produit.nom, fontWeight = FontWeight.Bold)
                Text("\${produit.prix} \$")
            }
        }
    }
}`,
    resultat:`┌───────────────────┐
│ Écran              │
│ 999 $              │
├───────────────────┤
│ Clavier            │
│ 49 $               │
├───────────────────┤
│ Souris             │
│ 25 $               │  ← défile verticalement
└───────────────────┘`,
    params:[
      ["items(list)","Génère un item par élément de la liste"],
      ["contentPadding","Marge intérieure globale de la liste"],
      ["verticalArrangement","Espacement entre les items, ex: Arrangement.spacedBy(8.dp)"],
      ["key = { it.id }","Identifiant stable par item — évite des bugs d'animation/recomposition"]
    ],
    erreurs:[
      ["IllegalStateException: Vertically scrollable component was measured with an infinity height","Une LazyColumn est placée dans un Column avec verticalScroll — les deux gèrent le scroll, ça entre en conflit. Retire le verticalScroll parent."],
      ["La liste ne s'affiche pas","La liste source est vide au premier rendu, souvent parce que les données arrivent d'une API de façon asynchrone — vérifie l'état de chargement."]
    ],
    exercice:{
      enonce:"Affiche une LazyColumn de 10 tâches (String) avec une Card par tâche.",
      indice:"items(taches) { tache -> Card { Text(tache) } }"
    },
    quiz:{
      q:"Pourquoi préférer LazyColumn à Column + verticalScroll pour une longue liste ?",
      options:["LazyColumn ne crée que les items visibles à l'écran","LazyColumn est plus jolie visuellement","Column ne peut pas défiler du tout","Il n'y a pas de différence"],
      correct:0,
      exp:"LazyColumn recycle et ne compose que les éléments visibles (+ une marge), ce qui la rend performante même avec des milliers d'items."
    },
    retenir:["LazyColumn = liste verticale performante.","items() parcourt une collection.","LazyRow existe pour l'horizontal, LazyVerticalGrid pour les grilles.","Ne jamais imbriquer un scroll vertical dans un autre."],
    prereq:["Column","Card","Kotlin: List"], suite:["state"]
  },

  state: {
    id:"state", title:"Comprendre l'état (State)", niveau:4, level:"mid", duration:"14 min",
    quoi:"Un <b>état</b> (state) est une valeur qui peut changer avec le temps et dont Compose « se souvient » entre les recompositions — quand elle change, l'interface se redessine automatiquement.",
    pourquoi:"Une variable Kotlin normale (var compteur = 0) est oubliée à chaque recomposition et ne déclenche aucun rafraîchissement visuel. remember + mutableStateOf permet à Compose de suivre la valeur et de redessiner l'écran quand elle change.",

function renderGlossaire(){
  let html = `<div class="eyebrow-free-title"><h1>Glossaire</h1><p class="sub">Tous les termes techniques du cours, définis simplement.</p></div>`;
  const sorted = [...GLOSSARY].sort((a,b)=>a[0].localeCompare(b[0]));
  let lastLetter = "";
  sorted.forEach(([term,def])=>{
    const letter = term[0].toUpperCase();
    if(letter!==lastLetter){ html += `<div class="gloss-letter">${letter}</div>`; lastLetter = letter; }
    html += `<div class="gloss-item"><b>${term}</b><p>${def}</p></div>`;
  });
  return html;
}

      <h3><span class="num">11</span>Exercice</h3>
      <details class="exercise-box">
        <summary>🧪 ${l.exercice.enonce}</summary>
        <p style="margin-top:12px; font-size:13.3px; color:var(--ink-soft);"><b>Indice :</b> ${l.exercice.indice}</p>
      </details>
    </div>

    <div class="section-block">
      <h3><span class="num">12</span>Quiz</h3>
      <div id="lessonQuizWrap">${quizBoxHTML(l,false)}</div>
    </div>

    <div class="section-block">
      <h3><span class="num">13</span>À retenir</h3>
      <ul class="retain-list">${l.retenir.map(r=>`<li>${r}</li>`).join('')}</ul>
    </div>

    ${(l.prereq||l.suite) ? `
    <hr class="sep">
    <div class="grid2">
      ${l.prereq ? `<div><h4 style="font-size:12.5px;color:var(--ink-soft);">Prérequis</h4><div class="related-row">${l.prereq.map(p=>`<span class="chip">${p}</span>`).join('')}</div></div>`:''}
      ${l.suite ? `<div><h4 style="font-size:12.5px;color:var(--ink-soft);">Après cette leçon</h4><div class="related-row">${l.suite.map(sid=>LESSONS[sid]?`<button class="chip linkable" data-open="${sid}">${LESSONS[sid].title}</button>`:'').join('')}</div></div>`:''}
    </div>`:''}

    <div class="lesson-nav">
      <button id="prevBtn" ${!prevId?'disabled style="opacity:.4"':''}>← ${prevId?LESSONS[prevId].title:'Précédent'}</button>
      <button id="finishBtn" class="finish ${isDone?'done':''}">${isDone?'✓ Terminé':'Terminer ✓'}</button>
      <button id="nextBtn" ${!nextId?'disabled style="opacity:.4"':''}>${nextId?LESSONS[nextId].title:'Suivant'} →</button>
    </div>
  `;
}

function afterLessonRender(id){
  document.getElementById('backLink').onclick = ()=>{ setActiveNav(document.querySelector('[data-view="parcours"]')); renderView('parcours'); };
  document.getElementById('favBtn').onclick = (e)=>{
    if(APP.favorites.has(id)) APP.favorites.delete(id); else APP.favorites.add(id);
    openLesson(id);
  };
  document.getElementById('finishBtn').onclick = ()=>{
    if(APP.completed.has(id)) APP.completed.delete(id); else APP.completed.add(id);
    buildSidebarLessons();
    openLesson(id);
  };
  const order = lessonOrder(); const pos = order.indexOf(id);
  const prevBtn = document.getElementById('prevBtn'); const nextBtn = document.getElementById('nextBtn');
  if(prevBtn && order[pos-1]) prevBtn.onclick = ()=>openLesson(order[pos-1]);
  if(nextBtn && order[pos+1]) nextBtn.onclick = ()=>openLesson(order[pos+1]);
  document.querySelectorAll('[data-open]').forEach(b=> b.onclick = ()=>openLesson(b.dataset.open));
  bindQuizBox(document.getElementById('lessonQuizWrap'), LESSONS[id]);
  bindCopyButtons();
}

/* ======================================================================
   HELPERS
   ====================================================================== */
function badgeHTML(level){
  const map = {beg:["🟢 Débutant","beg"], mid:["🟡 Intermédiaire","mid"], adv:["🔴 Avancé","adv"]};
  const [label,cls] = map[level] || map.beg;
  return `<span class="badge ${cls}">${label}</span>`;
}
function escapeHTML(s){ return (s||"").replace(/[&<>]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function codeBoxHTML(code){
  return `<div class="codebox"><button class="copy-btn" data-code="${encodeURIComponent(code)}">Copier</button><pre>${escapeHTML(code)}</pre></div>`;
}
function bindCopyButtons(){
  document.querySelectorAll('.copy-btn').forEach(b=>{
    b.onclick = ()=>{
      const text = decodeURIComponent(b.dataset.code);
      navigator.clipboard?.writeText(text).catch(()=>{});
      const old = b.textContent; b.textContent = "Copié ✓";
      setTimeout(()=>b.textContent=old, 1200);
    };
  });
}
function quizBoxHTML(l, showTitle){
  return `<div class="quiz-box">
    ${showTitle?`<div style="font-size:11.5px;color:var(--ink-soft); margin-bottom:6px;">${l.title}</div>`:''}
    <div class="quiz-q">${l.quiz.q}</div>
    ${l.quiz.options.map((o,i)=>`<button class="quiz-opt" data-i="${i}">${o}</button>`).join('')}
    <div class="quiz-fb" id="quizFb-${l.id}"></div>
  </div>`;
}
function bindQuizBox(container, l){
  if(!container) return;
  container.querySelectorAll('.quiz-opt').forEach(opt=>{
    opt.onclick = ()=>{
      const i = parseInt(opt.dataset.i);
      const opts = container.querySelectorAll('.quiz-opt');
      opts.forEach(o=>o.disabled=true);
      if(i===l.quiz.correct){ opt.classList.add('correct'); }
      else { opt.classList.add('wrong'); opts[l.quiz.correct].classList.add('correct'); }
      const fb = container.querySelector('.quiz-fb');
      fb.style.display='block';
      fb.textContent = (i===l.quiz.correct ? "✓ Exact — " : "✗ Pas tout à fait — ") + l.quiz.exp;
    };
  });
}

/* ======================================================================
   SEARCH — mots-clés directs + recherche par intention
   ====================================================================== */
function runSearch(query){
  query = query.trim().toLowerCase();
  if(!query) return null;
  // 1. correspondance directe sur titre de leçon
  for(const id of lessonOrder()){
    if(LESSONS[id].title.toLowerCase().includes(query)) return [id];
  }
  // 2. correspondance sur "Comment faire"
  for(const item of COMMENT_FAIRE){
    if(item.q.toLowerCase().includes(query)) return [item.id];
  }
  // 3. intention (contient un des mots-clés)
  for(const intent of INTENT_MAP){
    if(intent.keys.some(k=>query.includes(k) || k.includes(query))){
      return intent.ids;
    }
  }
  return [];
}

document.getElementById('searchInput').addEventListener('keydown', (e)=>{
  if(e.key !== 'Enter') return;
  const results = runSearch(e.target.value);
  if(!results){ return; }
  if(results.length===0){
    alert("Aucun résultat. Essaie : « faire une liste », « sauvegarder une donnée », « api », « changer de page »…");
    return;
  }
  openLesson(results[0]);
  e.target.value = "";
});

/* ======================================================================
   ROUTER
   ====================================================================== */
function renderView(view){
  APP.currentView = view; APP.currentLesson = null;
  const content = document.getElementById('content');
  let html = "";
  if(view==="dashboard") html = renderDashboard();
  else if(view==="parcours") html = renderParcours();
  else if(view==="comment") html = renderComment();
  else if(view==="composants") html = renderComposants();
  else if(view==="cheatsheets") html = renderCheatsheets();
  else if(view==="glossaire") html = renderGlossaire();
  else if(view==="quiz") html = renderQuiz();
  else if(view==="favoris") html = renderFavoris();
  content.innerHTML = html;

  if(view==="dashboard") afterDashboardRender();
  else if(view==="parcours") afterParcoursRender();
  else if(view==="comment") afterCommentRender();
  else if(view==="composants") afterComposantsRender();
  else if(view==="quiz") afterQuizRender();
  else if(view==="favoris") afterFavorisRender();

  document.getElementById('sidebar').classList.remove('open');
  window.scrollTo(0,0);
}

function openLesson(id){
  if(!LESSONS[id]) return;
  APP.currentView = "lesson"; APP.currentLesson = id;
  setActiveNav(document.querySelector(`[data-lesson="${id}"]`));
  document.getElementById('content').innerHTML = renderLesson(id);
  afterLessonRender(id);
  document.getElementById('sidebar').classList.remove('open');
  window.scrollTo(0,0);
}

/* ======================================================================
   INIT
   ====================================================================== */
buildSidebarLessons();
renderView('dashboard');
</script>
